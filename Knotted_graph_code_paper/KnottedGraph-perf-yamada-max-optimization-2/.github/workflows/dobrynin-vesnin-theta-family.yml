name: Dobrynin-Vesnin Theta family validation

on:
  pull_request:
    branches: [Latest_Workplace]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theta-family-0-20:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/yamada-max-optimization
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark environment
        run: uv sync --group dev --group benchmark
      - name: Require native backend
        run: uv run --no-sync python -c "from knotted_graph.invariants.yamada.native import native_available; assert native_available()"
      - name: Verify production dispatch has no theorem shortcut
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import NativeCompactEvaluator
          from knotted_graph.invariants.yamada.compact import PythonCompactYamadaEvaluator
          from knotted_graph.invariants.yamada.polynomial import Yamada, _ordered_crossing_ports
          from knotted_graph.invariants.yamada.state_compact import PreparedCompactStateBuilder
          import sys
          sys.path.insert(0, 'dev')
          import benchmark_dobrynin_vesnin_theta_family as bench
          _, processor, _ = bench.prepare_theta_family(9)
          y = Yamada.from_PDCode(processor)
          p = PreparedCompactStateBuilder.prepare(y.vertices, y.crossings, y.arcs, _ordered_crossing_ports)
          e = NativeCompactEvaluator(PythonCompactYamadaEvaluator)
          e.compute_prepared_laurent(p)
          assert e.theta_twist_calls == 0
          assert e.structural_calls == 1
          assert e.last_structural_stats['r1_moves'] > 0
          print(e.last_structural_stats)
          PY
      - name: Exact structural regression tests
        run: uv run --no-sync pytest -q tests/invariants/yamada/test_reidemeister_ii_preprocessing.py tests/invariants/yamada/test_diagram_structural_dispatch.py
      - name: Benchmark public KG and Topoly against Theorem 2 through n=20
        run: uv run --no-sync python dev/benchmark_dobrynin_vesnin_theta_family.py --start 0 --stop 20 --timeout 25
