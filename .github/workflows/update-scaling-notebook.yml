name: Update optimized scaling notebook

on:
  pull_request:
    branches: [Latest_Workplace]
    paths:
      - ".github/workflows/update-scaling-notebook.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/yamada-max-optimization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add generic Theta validation section
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('User_guide/benchmarks/03_knottedgraph_vs_topoly_scaling.ipynb')
          nb = json.loads(path.read_text())
          marker = '## Certified Dobrynin--Vesnin family: generic production validation'
          if any(marker in ''.join(cell.get('source', [])) for cell in nb['cells']):
              print('section already present')
              raise SystemExit

          markdown = r'''## Certified Dobrynin--Vesnin family: generic production validation

The high-crossing comparison is additionally checked against an **analytic correctness oracle**, rather than treating either implementation as ground truth.

**Reference.** A. A. Dobrynin and A. Yu. Vesnin, *The Yamada polynomial for graphs, embedded knot-wise into three-dimensional space*, **Vychisl. Sistemy 155** (1996), 37--86, **Theorem 2**.

For the canonical family $\Theta(n)$, with odd $n$ giving a theta graph and even $n$ a pince-nez/handcuff graph, Theorem 2 states

$$
R(\Theta(n))(A)=
(A^2+A+1+A^{-1}+A^{-2})A^n
-(A+A^{-1})A^{-2n}
-(A^2+1+A^{-2})(-1)^nA^{-n}.
$$

### Why this is not a theorem lookup

The production KnottedGraph evaluator does **not** recognize $\Theta(n)$ and does not call this formula. The theorem is expanded independently only after the timed calculation and is used as an external oracle. High-crossing production evaluation instead uses generic exact operations:

1. conservative Reidemeister-II cancellation;
2. exact Reidemeister-I curl reduction, $R(D_-)=A^{-2}R(D)$ and $R(D_+)=A^{2}R(D)$ in the package convention;
3. crossing inversion plus the Yamada skein identity;
4. exact memoization modulo prepared-diagram combinatorial isomorphism; and
5. the native exhaustive state evaluator only on small irreducible residual states.

The R1 factors were independently checked against the retained exhaustive state sum in **190 local comparisons across both orientations and multiple surrounding graph contexts**. The native isomorphism fingerprint is only a bucket filter; cache reuse requires a complete exact bijection, so hash collisions cannot change an answer.

### Clean public-API result

In the production validation run, KnottedGraph matched Dobrynin--Vesnin Theorem 2 **term-for-term for every $n=0,\ldots,20$**. Topoly 1.1.0 agreed through $n=16$ up to the allowed sign/monomial/variable-inversion conventions, returned a non-equivalent polynomial at $n=17$, and raised `ValueError: Adding unsupported type.` at $n=18,19,20$.

At $n=17$, the same-run public timings were **0.0662 s for KnottedGraph** and **1.4262 s for Topoly**, a ratio of about **21.5x**. This statement is specific to the certified $\Theta(n)$ benchmark family; it is not a general claim that all Topoly computations above 16 crossings fail.

The companion page `dobrynin_vesnin_theta_validation.md` records the complete $n=0,\ldots,20$ table and the non-circular legacy checks.
'''
          code = '''# Reproduce the full certified public-API comparison (n = 0,...,20).\n# The Dobrynin--Vesnin formula is used only as the post-computation oracle.\nimport subprocess\nimport sys\n\nsubprocess.run(\n    [\n        sys.executable,\n        \"../../dev/benchmark_dobrynin_vesnin_theta_family.py\",\n        \"--start\", \"0\",\n        \"--stop\", \"20\",\n        \"--timeout\", \"25\",\n    ],\n    check=True,\n)\n'''

          nb['cells'].extend([
              {
                  'cell_type': 'markdown',
                  'metadata': {},
                  'source': markdown.splitlines(keepends=True),
              },
              {
                  'cell_type': 'code',
                  'execution_count': None,
                  'metadata': {},
                  'outputs': [],
                  'source': code.splitlines(keepends=True),
              },
          ])
          path.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + '\n')
          print('updated', path)
          PY
      - name: Commit notebook update
        run: |
          if git diff --quiet -- User_guide/benchmarks/03_knottedgraph_vs_topoly_scaling.ipynb; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add User_guide/benchmarks/03_knottedgraph_vs_topoly_scaling.ipynb
          git commit -m "Document generic Yamada breakthrough in scaling notebook"
          git push origin HEAD:perf/yamada-max-optimization
