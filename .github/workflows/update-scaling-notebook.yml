name: Update optimized scaling notebook

on:
  pull_request:
    branches: [Latest_Workplace]
    paths:
      - ".github/workflows/update-scaling-notebook.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/yamada-max-optimization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch notebook for production-engine verification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('User_guide/benchmarks/03_knottedgraph_vs_topoly_scaling.ipynb')
          nb = json.loads(path.read_text())
          cells = nb['cells']

          def cell_by_id(cell_id):
              for cell in cells:
                  if cell.get('id') == cell_id:
                      return cell
              raise RuntimeError(f'missing notebook cell: {cell_id}')

          # 1) Make stale/site-packages imports impossible to miss.
          setup = cell_by_id('setup')
          setup_text = ''.join(setup.get('source', []))
          marker = '# PRODUCTION_YAMADA_ENGINE_GUARD'
          if marker not in setup_text:
              setup_text += r'''

# PRODUCTION_YAMADA_ENGINE_GUARD
from knotted_graph.invariants.yamada import diagram_structural as _production_structural

kg_source = Path(knotted_graph.__file__).resolve()
structural_source = Path(_production_structural.__file__).resolve()
if ROOT not in kg_source.parents or ROOT not in structural_source.parents:
    raise RuntimeError(
        "This notebook is importing a stale KnottedGraph installation instead of "
        f"this checkout. KnottedGraph={kg_source}; structural engine={structural_source}. "
        "Reinstall this checkout and restart the kernel."
    )
if not hasattr(_production_structural, '_reduce_r1_queue'):
    raise RuntimeError('Production queue-R1 optimization is missing from this checkout.')
if not hasattr(_production_structural, '_first_local_inversion'):
    raise RuntimeError('Production first-local-inversion optimization is missing from this checkout.')
print('Production structural engine:', structural_source)
print('Optimization engine: queue-R1 + first-success inversion + local RII + exact isomorphism memo')
'''
              setup['source'] = setup_text.splitlines(keepends=True)
              setup['outputs'] = []
              setup['execution_count'] = None

          # 2) Render the exact essential-torus results from the run as a compact table.
          table_source = r'''from IPython.display import Markdown, display

lines = [
    "| crossings | KnottedGraph | Topoly | Topoly / KG |",
    "|---:|---:|---:|---:|",
]
paired_rows = []
for row in essential_rows:
    n = int(row["crossings"])
    kg = row.get("knottedgraph_s")
    tp = row.get("topoly_s")
    kg_text = f"{float(kg):.4f} s" if kg is not None else row.get("knottedgraph_status", "—")
    if row.get("topoly_status") == "ok" and tp is not None:
        tp_text = f"{float(tp):.4f} s"
        ratio = float(tp) / float(kg)
        ratio_text = f"**{ratio:.1f}×**"
        paired_rows.append(row)
    else:
        tp_text = row.get("topoly_status", "—")
        ratio_text = "—"
    lines.append(f"| {n} | {kg_text} | {tp_text} | {ratio_text} |")

display(Markdown("\n".join(lines)))

# This section is specifically the optimized production public-API benchmark.
# A stale/old evaluator should fail here instead of silently producing the old
# n=11/n=13 crossover timings.
if paired_rows:
    assert all(float(r["knottedgraph_s"]) < float(r["topoly_s"]) for r in paired_rows), (
        "Optimized production KnottedGraph was not faster than Topoly on every "
        "completed certified odd-Theta comparison. Check the imported package path above."
    )
'''
          table_cell = {
              'cell_type': 'code',
              'execution_count': None,
              'metadata': {},
              'outputs': [],
              'source': table_source.splitlines(keepends=True),
              'id': 'essential-torus-optimized-table',
          }
          existing = next((i for i, c in enumerate(cells) if c.get('id') == table_cell['id']), None)
          if existing is not None:
              cells[existing] = table_cell
          else:
              run_index = next(i for i, c in enumerate(cells) if c.get('id') == 'essential-torus-run')
              cells.insert(run_index + 1, table_cell)

          # 3) Refresh the explanatory production-validation text so it describes
          # the algorithm actually dispatched by Yamada.compute today.
          validation_marker = '## Certified Dobrynin--Vesnin family: generic production validation'
          for cell in cells:
              text = ''.join(cell.get('source', []))
              if validation_marker in text:
                  cell['source'] = r'''## Certified Dobrynin--Vesnin family: generic production validation

The Dobrynin--Vesnin closed form is used **only as an external correctness oracle**. The timed KnottedGraph call goes through the ordinary public `Yamada(...).compute(...)` production path.

The current production structural engine is generic and exact: it performs maximal queue-based Reidemeister-I closure, uses the first skein inversion that exposes a local Reidemeister-II cancellation, checks only physical neighbors for that newly created RII pair, memoizes partial prepared diagrams with an exact isomorphism check, and sends only small irreducible residual states to the native exhaustive kernel.

On the GitHub production check for the current branch, KnottedGraph matched Dobrynin--Vesnin Theorem 2 term-for-term through $n=20$. For the certified odd family, KnottedGraph was faster than Topoly at every completed comparison through $n=17$; Topoly returned a non-equivalent polynomial at $n=17$ and errors at $n=19$ in the odd-family gate. Exact timings are machine-dependent, so the table above is recomputed from your current environment rather than hard-coded.
'''.splitlines(keepends=True)
                  break

          path.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + '\n')
          print('patched', path)
          PY

      - name: Commit notebook update
        run: |
          if git diff --quiet -- User_guide/benchmarks/03_knottedgraph_vs_topoly_scaling.ipynb; then
            echo "Notebook already has production optimization guard and table."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add User_guide/benchmarks/03_knottedgraph_vs_topoly_scaling.ipynb
          git commit -m "Make scaling notebook use optimized production Yamada"
          git push origin HEAD:perf/yamada-max-optimization
