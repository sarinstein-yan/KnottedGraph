name: Yamada factorized width research

on:
  push:
    branches: [research/yamada-unified-state-dp-20260822]
    paths:
      - 'dev/diagnose_yamada_factorized_width.py'
      - '.github/workflows/yamada-factorized-width-research.yml'
  pull_request:
    branches: [agent/yamada-family-regression-fix-20260822]
    paths:
      - 'dev/diagnose_yamada_factorized_width.py'
      - '.github/workflows/yamada-factorized-width-research.yml'

jobs:
  width:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: THETA_N_VALUES, n: 15}
          - {family: LLLV_CYCLE_N_VALUES, n: 15}
          - {family: LLLV_THETA_S_VALUES, n: 9}
          - {family: LLLV_THETA_S_VALUES, n: 11}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: python dev/diagnose_yamada_factorized_width.py '${{ matrix.family }}' '${{ matrix.n }}'
