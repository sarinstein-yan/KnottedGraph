name: Optimized-only migration validation (temporary)

on:
  push:
    branches:
      - agent/optimized-only-validation-20260821
  pull_request:
    branches:
      - perf/yamada-max-optimization

permissions:
  contents: write

concurrency:
  group: optimized-only-validation-temp
  cancel-in-progress: true

jobs:
  migrate-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimized-only-validation-20260821
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply deterministic optimized-only migration
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              "kg_migration_bootstrap", root / "dev/bootstrap_optimized_only_migration.py"
          )
          bootstrap = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bootstrap)
          bootstrap.write_payload()

          old_marker = "compute_yamada_" + "polynomial_recursive("
          new_marker = "compute_graph_yamada_polynomial("
          for relative in (
              "dev/validate_notebook_portability.py",
              "dev/normalize_notebook_environments.py",
          ):
              path = root / relative
              path.write_text(
                  path.read_text(encoding="utf-8").replace(old_marker, new_marker),
                  encoding="utf-8",
              )

          migration = root / "dev/migrate_optimized_paths.py"
          text = migration.read_text(encoding="utf-8")
          needle = '    Path("dev/application_yamada_regression.py"),\n}'
          replacement = (
              '    Path("dev/application_yamada_regression.py"),\n'
              '    Path("dev/migrate_optimized_paths.py"),\n'
              '    Path("dev/bootstrap_optimized_only_migration.py"),\n'
              '}'
          )
          if needle not in text:
              raise RuntimeError("could not extend migration self-audit allowlist")
          migration.write_text(text.replace(needle, replacement), encoding="utf-8")

          consistency = root / "dev/check_repository_consistency.py"
          ctext = consistency.read_text(encoding="utf-8")
          old = '    return [ROOT / line for line in out.splitlines() if line]\n'
          new = (
              '    paths = [ROOT / line for line in out.splitlines() if line]\n'
              '    return [path for path in paths if path.exists()]\n'
          )
          if old not in ctext:
              raise RuntimeError("could not make repository audit deletion-aware")
          consistency.write_text(ctext.replace(old, new), encoding="utf-8")

          bootstrap.patch_nodal()
          bootstrap.patch_material_base()
          bootstrap.patch_material_public()
          bootstrap.delete_obsolete()
          bootstrap.patch_notebooks_and_docs()
          print("PASS: optimized-only migration applied deterministically")
          PY

      - name: Normalize notebook package environments
        run: python dev/normalize_notebook_environments.py

      - name: Install complete validation environment and build native extension
        run: uv sync --extra all --group dev --group docs --group benchmark

      - name: Verify native backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available, native_import_error
          assert native_available(), native_import_error()
          print('PASS: native Yamada backend available')
          PY

      - name: Check optimized-only migration is idempotent
        run: uv run --no-sync python dev/migrate_optimized_paths.py --check

      - name: Repository consistency
        run: uv run --no-sync python dev/check_repository_consistency.py

      - name: Notebook portability
        run: uv run --no-sync python dev/validate_notebook_portability.py

      - name: Ruff
        run: uv run --no-sync ruff check src tests dev

      - name: Full pytest suite
        run: uv run --no-sync pytest -q

      - name: Execute Yamada sanity notebook
        env:
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: 'true'
        run: uv run --no-sync jupyter nbconvert --to notebook --execute User_guide/benchmarks/01_sanity_checks.ipynb --output /tmp/01_sanity_checks.executed.ipynb --ExecutePreprocessor.timeout=1800

      - name: Execute application output regression notebook
        env:
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: 'true'
        run: uv run --no-sync jupyter nbconvert --to notebook --execute User_guide/benchmarks/02_application_output_regression.ipynb --output /tmp/02_application_output_regression.executed.ipynb --ExecutePreprocessor.timeout=2400

      - name: Execute 45-case ground-truth notebook
        env:
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: 'true'
        run: uv run --no-sync jupyter nbconvert --to notebook --execute User_guide/benchmarks/04_synthetic_ground_truth_validation.ipynb --output /tmp/04_synthetic_ground_truth_validation.executed.ipynb --ExecutePreprocessor.timeout=3600

      - name: Remove temporary migration scaffolding
        run: |
          rm -rf dev/.migration_payload
          rm -f dev/bootstrap_optimized_only_migration.py
          rm -f .github/workflows/optimized-only-validation-temp.yml

      - name: Commit validated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
          else
            git commit -m 'Use canonical optimized skeleton and Yamada paths'
            git push origin HEAD:agent/optimized-only-validation-20260821
          fi
