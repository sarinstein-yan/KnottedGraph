name: Apply periodic theta section

on:
  push:
    branches: [perf/yamada-max-optimization]
    paths:
      - .github/workflows/apply-periodic-theta-section.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/yamada-max-optimization
          fetch-depth: 0
      - name: Insert section only
        run: |
          python dev/append_periodic_theta_notebook_section.py
          git diff --name-only
          test "$(git diff --name-only)" = "User_guide/applications/02_mathematics_applications.ipynb"
      - name: Commit notebook update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add User_guide/applications/02_mathematics_applications.ipynb
          git commit -m "Add verified periodic theta Yamada section"
          git push origin HEAD:perf/yamada-max-optimization
