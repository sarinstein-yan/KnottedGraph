name: Temporary hard structural probe

on:
  push:
    branches:
      - diagnostic/hard-source-inspect-20260822
  pull_request:
    branches:
      - YAMADA_Optimization_LATEST

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        case_id: [147, 148, 149, 174, 175, 178, 201, 202, 203]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation environment
        run: uv sync --extra all --group dev --group benchmark
      - name: Probe reconstruction case ${{ matrix.case_id }}
        env:
          CASE_ID: '${{ matrix.case_id }}'
          PYTHONNOUSERSITE: '1'
          PYTHONUNBUFFERED: '1'
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: 'true'
          PLOTLY_RENDERER: json
        run: uv run --no-sync python -u dev/_tmp_hard_structural_probe.py
