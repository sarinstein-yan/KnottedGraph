name: Temporary theta pre-prepare fast path

on:
  push:
    branches: [perf/yamada-max-optimization]
    paths:
      - .github/workflows/temporary-theta-preprepare-fastpath.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/yamada-max-optimization
      - name: Insert exact full-diagram fast path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/knotted_graph/invariants/yamada/polynomial.py')
          text = path.read_text()
          old = '''    def _compute_laurent_block(self, evaluator):
                  prepared = self._prepare_compact_state_builder()
          '''
          new = '''    def _compute_laurent_block(self, evaluator):
                  # Recognize theorem-backed Theta(n) diagrams before building the
                  # generic prepared crossing tables.  This certificate uses original
                  # edge provenance and returns None for every unrecognized diagram.
                  from .theta_twist import certified_theta_twist_laurent

                  theta_value = certified_theta_twist_laurent(
                      self.vertices,
                      self.crossings,
                      self.arcs,
                      _ordered_crossing_ports,
                  )
                  if theta_value is not None:
                      return theta_value

                  prepared = self._prepare_compact_state_builder()
          '''
          if new in text:
              print('already applied')
          else:
              if old not in text:
                  raise SystemExit('target block not found')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/knotted_graph/invariants/yamada/polynomial.py
          git commit -m "Recognize certified theta family before state preparation"
          git fetch origin perf/yamada-max-optimization
          git rebase origin/perf/yamada-max-optimization
          git push origin HEAD:perf/yamada-max-optimization
