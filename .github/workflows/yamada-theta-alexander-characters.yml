name: Yamada theta Alexander characters

on:
  pull_request:
    paths:
      - "dev/certify_theta_alexander_character_variety.py"
      - ".github/workflows/yamada-theta-alexander-characters.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alexander-characters:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research environment
        run: uv sync --group dev --group benchmark
      - name: Build plantri 5.8
        run: |
          curl -fsSLo /tmp/plantri58.tar.gz https://users.cecs.anu.edu.au/~bdm/plantri/plantri58.tar.gz
          mkdir -p /tmp/plantri-src
          tar -xzf /tmp/plantri58.tar.gz -C /tmp/plantri-src --strip-components=1
          cc -O3 -o /tmp/plantri /tmp/plantri-src/plantri.c
      - name: Compute finite-field Alexander character profiles
        run: |
          uv run --no-sync python dev/certify_theta_alexander_character_variety.py \
            --plantri /tmp/plantri \
            --output research_results/theta8_alexander_character_profiles.json
      - name: Upload certificate
        uses: actions/upload-artifact@v4
        with:
          name: theta8-alexander-character-profiles
          path: research_results/theta8_alexander_character_profiles.json
          if-no-files-found: error
