name: Yamada native prepared candidate

on:
  pull_request:
    paths:
      - "dev/benchmark_native_prepared_candidate.py"
      - ".github/workflows/yamada-flow-candidate.yml"

permissions:
  contents: read

jobs:
  native-prepared-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install environment
        run: uv sync --group dev
      - name: Benchmark exact native prepared-diagram candidate
        run: uv run --no-sync python dev/benchmark_native_prepared_candidate.py
