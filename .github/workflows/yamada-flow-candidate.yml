name: Yamada exact optimization candidates

on:
  pull_request:
    paths:
      - "dev/benchmark_native_prepared_candidate.py"
      - "dev/benchmark_native_discrete_canonical_candidate.py"
      - "dev/benchmark_frontier_flow_candidate.py"
      - ".github/workflows/yamada-flow-candidate.yml"

permissions:
  contents: read

jobs:
  exact-native-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install environment
        run: |
          uv sync --group dev
          uv pip install pybind11
      - name: Benchmark exact native prepared-diagram candidate
        run: uv run --no-sync python dev/benchmark_native_prepared_candidate.py
      - name: Benchmark exact discrete-canonical memo candidate
        run: uv run --no-sync python dev/benchmark_native_discrete_canonical_candidate.py
      - name: Benchmark bounded-frontier flow-polynomial candidate
        run: uv run --no-sync python dev/benchmark_frontier_flow_candidate.py
