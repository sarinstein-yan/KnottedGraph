name: Yamada exact optimization candidates

on:
  pull_request:
    paths:
      - "dev/benchmark_frontier_flow_candidate.py"
      - ".github/workflows/yamada-flow-candidate.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontier-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install environment
        run: uv sync --group dev
      - name: Benchmark bounded-frontier flow-polynomial candidate
        run: uv run --no-sync python dev/benchmark_frontier_flow_candidate.py
