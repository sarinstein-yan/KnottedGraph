name: One-off finalize optimization branch

# Retrigger after declaring the concrete fast-evaluator recurrence contract.
on:
  pull_request:
    branches: [Latest_Workplace]
    paths:
      - .github/workflows/oneoff-finalize-optimization.yml

permissions:
  contents: write

concurrency:
  group: knottedgraph-finalize-optimization-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: perf/yamada-max-optimization
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-migration nodal environment
        run: uv sync --extra nodal --group dev

      - name: Record public NodalSkeleton calling contract
        run: |
          uv run --no-sync python - <<'PY'
          import inspect
          import json
          from knotted_graph.applications.nodal import NodalSkeleton

          contract = []
          for name, parameter in inspect.signature(NodalSkeleton.__init__).parameters.items():
              if name == "self":
                  continue
              default = (
                  "<required>"
                  if parameter.default is inspect.Parameter.empty
                  else repr(parameter.default)
              )
              contract.append([name, default, str(parameter.kind)])
          with open("/tmp/nodal-api.json", "w") as handle:
              json.dump(contract, handle)
          print("pre-migration contract:", contract)
          PY

      - name: Apply source and dependency migration
        run: python dev/oneoff_quality_upgrade.py

      - name: Regenerate locked environment
        run: uv lock

      - name: Install migrated full environment
        run: uv sync --all-extras --group dev --group docs --group benchmark

      - name: Require unchanged NodalSkeleton calling contract
        run: |
          uv run --no-sync python - <<'PY'
          import inspect
          import json
          from knotted_graph.applications.nodal import NodalSkeleton

          with open("/tmp/nodal-api.json") as handle:
              before = json.load(handle)
          after = []
          for name, parameter in inspect.signature(NodalSkeleton.__init__).parameters.items():
              if name == "self":
                  continue
              default = (
                  "<required>"
                  if parameter.default is inspect.Parameter.empty
                  else repr(parameter.default)
              )
              after.append([name, default, str(parameter.kind)])
          assert after == before, (before, after)
          print("public calling contract unchanged:", after)
          PY

      - name: Run exact nodal regression suite
        run: uv run --no-sync pytest -q tests/applications/test_nodal_regressions.py

      - name: Generate versioned paper benchmark corpus
        run: uv run --no-sync python dev/generate_topoly_random_cubic_corpus.py

      - name: Validate committed benchmark corpus
        run: uv run --no-sync pytest -q tests/benchmarks/test_topoly_paper_setup.py

      - name: Run incremental Pyright checks
        run: uv run --no-sync pyright

      - name: Measure full-suite coverage baseline
        run: >
          uv run --no-sync pytest -q
          --cov=knotted_graph
          --cov-report=term-missing
          --cov-report=json:coverage.json

      - name: Run hard application-output regression
        env:
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: "true"
        run: >
          uv run --no-sync python dev/execute_notebook.py
          User_guide/benchmarks/02_application_output_regression.ipynb
          --timeout 7200

      - name: Promote pre-benchmarked native path and finalize permanent CI
        run: uv run --no-sync python dev/oneoff_finalize_quality.py

      - name: Audit cleaned repository consistency
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PYTHONNOUSERSITE: "1"
        run: uv run --no-sync python dev/check_repository_consistency.py

      - name: Remove this one-off workflow
        run: git rm .github/workflows/oneoff-finalize-optimization.yml

      - name: Commit only after every pre-commit gate passes
        run: |
          rm -f coverage.json coverage.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Finalize optimized exact Yamada and release-quality gates"
          git push origin HEAD:perf/yamada-max-optimization
