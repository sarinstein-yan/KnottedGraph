name: Yamada clean-right prime search

on:
  pull_request:
    paths:
      - "dev/search_clean_right_prime_projection.py"
      - ".github/workflows/yamada-clean-right-prime-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-right-prime-search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research environment
        run: uv sync --group dev --group benchmark
      - name: Build plantri 5.8
        run: |
          curl -fsSLo /tmp/plantri58.tar.gz https://users.cecs.anu.edu.au/~bdm/plantri/plantri58.tar.gz
          mkdir -p /tmp/plantri-src
          tar -xzf /tmp/plantri58.tar.gz -C /tmp/plantri-src --strip-components=1
          cc -O3 -o /tmp/plantri /tmp/plantri-src/plantri.c
      - name: Search 100k projections for clean-right unknot disk
        run: |
          uv run --no-sync python dev/search_clean_right_prime_projection.py \
            --plantri /tmp/plantri \
            --output research_results/theta8_clean_right_prime_search.json \
            --xyz-dir research_results/theta8_clean_right_lifts \
            --rotations 100000
      - name: Upload certificate
        uses: actions/upload-artifact@v4
        with:
          name: theta8-clean-right-prime-search
          path: |
            research_results/theta8_clean_right_prime_search.json
            research_results/theta8_clean_right_lifts/**
          if-no-files-found: error
