name: Embed DV validation in notebook

on:
  push:
    branches: [perf/yamada-max-optimization]
  workflow_dispatch:

jobs:
  embed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/yamada-max-optimization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Embed full validation markdown and validate notebook
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          nb_path = Path('User_guide/benchmarks/03_knottedgraph_vs_topoly_scaling.ipynb')
          md_path = Path('User_guide/benchmarks/dobrynin_vesnin_theta_validation.md')
          nb = json.loads(nb_path.read_text())
          validation_md = md_path.read_text()

          remove_ids = {'dv-theorem', 'dv-interpretation', 'dv-validation-writeup'}
          cells = [c for c in nb['cells'] if c.get('id') not in remove_ids]
          insert_at = next(i for i, c in enumerate(cells) if c.get('id') == 'dv-config-text')
          cells.insert(insert_at, {
              'cell_type': 'markdown',
              'metadata': {'kg_section': 'dobrynin-vesnin-full-family'},
              'source': validation_md,
              'id': 'dv-validation-writeup',
          })
          nb['cells'] = cells

          # Require exact synchronization with the standalone validation document.
          embedded = next(c for c in nb['cells'] if c.get('id') == 'dv-validation-writeup')
          assert embedded['source'] == validation_md

          # Validate every code cell after the edit.
          for cell in nb['cells']:
              if cell.get('cell_type') != 'code':
                  continue
              source = cell.get('source', '')
              if isinstance(source, list):
                  source = ''.join(source)
              compile(source, f"<cell {cell.get('id')}>", 'exec')

          nb_path.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + '\n')
          print('Embedded exact markdown:', md_path)
          print('Validated all code-cell syntax.')
          PY
      - name: Commit notebook
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add User_guide/benchmarks/03_knottedgraph_vs_topoly_scaling.ipynb
          if git diff --cached --quiet; then
            echo 'Notebook already synchronized.'
          else
            git commit -m 'Embed full Dobrynin-Vesnin validation in benchmark notebook'
            git push origin HEAD:perf/yamada-max-optimization
          fi
