name: Temporary final metadata cleanup

on:
  pull_request:
    branches:
      - YAMADA_Optimization_LATEST

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/yamada-projection-skeleton-robustness-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite stale metadata and remove this helper
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          for path in Path('User_guide').rglob('*.ipynb'):
              nb = json.loads(path.read_text())
              metadata = nb.setdefault('metadata', {})
              if metadata.get('based_on_branch') == 'Latest_Workplace':
                  metadata['based_on_branch'] = 'YAMADA_Optimization_LATEST'
                  path.write_text(json.dumps(nb, indent=1) + '\n')

          path = Path('dev/normalize_notebook_environments.py')
          text = path.read_text()
          start = text.index('def repair_regression(nb):')
          end = text.index('\ndef repair_generic(nb):', start)
          replacement = '''def repair_regression(nb):
    # Notebook 02 is self-contained and uses a frozen canonical digest.
    # Historical source-worktree comparisons are intentionally forbidden.
    return

'''
          text = text[:start] + replacement + text[end + 1:]
          old = '''            if path.name != "02_application_output_regression.ipynb":
                for frag in SOURCE_OVERRIDE_FRAGMENTS:
                    if frag in s:
                        raise AssertionError(f"{path}: stale source override: {frag}")
'''
          new = '''            for frag in SOURCE_OVERRIDE_FRAGMENTS:
                if frag in s:
                    raise AssertionError(f"{path}: stale source override: {frag}")
'''
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/tmp-final-metadata-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove final stale notebook optimization references'
          git push origin HEAD:fix/yamada-projection-skeleton-robustness-20260822
