name: Candidate Yamada PD reduction

on:
  push:
    branches:
      - analysis/topoly-yamada-internals-20260818
    paths:
      - .github/workflows/candidate-yamada-pd-reduction.yml

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/topoly-yamada-internals-20260818
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply conservative RII reducer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/knotted_graph/invariants/yamada/state_compact.py')
          text = path.read_text()
          needle = '''    def build(self, state: tuple[int, ...]) -> CompactGraph:\n'''
          assert text.count(needle) == 1
          methods = r'''    def _find_reidemeister_ii_pair(self):
        """Return one conservatively recognized Reidemeister-II crossing pair.

        A removable bigon consists of two crossings joined by exactly two
        physical arcs. Those arcs occupy adjacent cyclic positions at both
        crossings and preserve over/under parity between their endpoints.
        The parity criterion is invariant under the remaining half-turn
        ambiguity of the crossing-port ordering.
        """
        crossing_for_port = self.crossing_for_port
        arc_partner = self.arc_partner

        for first in range(len(self.ordered_ports)):
            first_ports = self.ordered_ports[first]
            for second in range(first):
                second_ports = self.ordered_ports[second]
                second_set = set(second_ports)
                shared = []
                for first_position, first_port in enumerate(first_ports):
                    partner = arc_partner[first_port]
                    if partner not in second_set:
                        continue
                    second_position = second_ports.index(partner)
                    if crossing_for_port[partner] != second:
                        continue
                    shared.append(
                        (first_position, second_position, first_port, partner)
                    )

                if len(shared) != 2:
                    continue

                first_positions = [entry[0] for entry in shared]
                second_positions = [entry[1] for entry in shared]
                if (first_positions[0] - first_positions[1]) % 4 not in (1, 3):
                    continue
                if (second_positions[0] - second_positions[1]) % 4 not in (1, 3):
                    continue
                if any((a % 2) != (b % 2) for a, b, _, _ in shared):
                    continue

                removed = set(first_ports) | set(second_ports)
                splices = []
                valid = True
                for first_position, second_position, _, _ in shared:
                    first_external = first_ports[(first_position + 2) % 4]
                    second_external = second_ports[(second_position + 2) % 4]
                    remote_first = arc_partner[first_external]
                    remote_second = arc_partner[second_external]
                    if (
                        remote_first in removed
                        or remote_second in removed
                        or remote_first == remote_second
                    ):
                        valid = False
                        break
                    splices.append((remote_first, remote_second))
                if valid and len({port for pair in splices for port in pair}) == 4:
                    return first, second, tuple(splices)
        return None

    def _remove_reidemeister_ii_pair(self, first, second, splices):
        removed_crossings = {first, second}
        removed_ports = set(self.ordered_ports[first]) | set(self.ordered_ports[second])
        active_ports = [
            port for port in range(len(self.arc_partner)) if port not in removed_ports
        ]
        old_to_new = {old: new for new, old in enumerate(active_ports)}

        partner = list(self.arc_partner)
        for left, right in splices:
            partner[left] = right
            partner[right] = left

        new_arc_partner = []
        for old in active_ports:
            old_partner = partner[old]
            if old_partner not in old_to_new:
                raise RuntimeError('RII reduction left an arc attached to a removed port.')
            new_arc_partner.append(old_to_new[old_partner])

        surviving_crossings = [
            index
            for index in range(len(self.crossing_ids))
            if index not in removed_crossings
        ]
        crossing_remap = {
            old: new for new, old in enumerate(surviving_crossings)
        }
        new_crossing_for_port = []
        for old_port in active_ports:
            old_crossing = self.crossing_for_port[old_port]
            if old_crossing < 0:
                new_crossing_for_port.append(-1)
            else:
                if old_crossing in removed_crossings:
                    raise RuntimeError('RII reduction retained a removed crossing port.')
                new_crossing_for_port.append(crossing_remap[old_crossing])

        new_ordered_ports = tuple(
            tuple(old_to_new[port] for port in self.ordered_ports[index])
            for index in surviving_crossings
        )
        port_count = len(active_ports)
        plus_partner = [-1] * port_count
        minus_partner = [-1] * port_count
        for ports in new_ordered_ports:
            for a, b in _PLUS_PAIRS:
                pa, pb = ports[a], ports[b]
                plus_partner[pa] = pb
                plus_partner[pb] = pa
            for a, b in _MINUS_PAIRS:
                pa, pb = ports[a], ports[b]
                minus_partner[pa] = pb
                minus_partner[pb] = pa

        return PreparedCompactStateBuilder(
            vertex_ids=self.vertex_ids,
            crossing_ids=tuple(self.crossing_ids[index] for index in surviving_crossings),
            ordered_ports=new_ordered_ports,
            arc_partner=tuple(new_arc_partner),
            fixed_terminal_index=tuple(
                self.fixed_terminal_index[port] for port in active_ports
            ),
            crossing_for_port=tuple(new_crossing_for_port),
            plus_partner=tuple(plus_partner),
            minus_partner=tuple(minus_partner),
        )

    def reduce_reidemeister_ii(self):
        """Cancel all conservatively detectable Reidemeister-II bigons.

        Returns ``(builder, count)`` where ``count`` is the number of RII moves
        and each move removes exactly two projection crossings. This is an
        internal exact regular-isotopy preprocessing step; it never changes
        public graph objects or the public API.
        """
        current = self
        count = 0
        while True:
            candidate = current._find_reidemeister_ii_pair()
            if candidate is None:
                return current, count
            current = current._remove_reidemeister_ii_pair(*candidate)
            count += 1

'''
          path.write_text(text.replace(needle, methods + needle))

          poly = Path('src/knotted_graph/invariants/yamada/polynomial.py')
          text = poly.read_text()
          old = '''        prepared = PreparedCompactStateBuilder.prepare(\n            self.vertices,\n            self.crossings,\n            self.arcs,\n            _ordered_crossing_ports,\n        )\n        for config in itertools.product([0, 1, 2], repeat=len(self.crossings)):\n            yield prepared.build(config), config.count(0) - config.count(1)\n'''
          new = '''        prepared = PreparedCompactStateBuilder.prepare(\n            self.vertices,\n            self.crossings,\n            self.arcs,\n            _ordered_crossing_ports,\n        )\n        prepared, _ = prepared.reduce_reidemeister_ii()\n        crossing_count = len(prepared.crossing_ids)\n        for config in itertools.product([0, 1, 2], repeat=crossing_count):\n            yield prepared.build(config), config.count(0) - config.count(1)\n'''
          assert text.count(old) == 1
          poly.write_text(text.replace(old, new))
          PY
      - name: Install exact benchmark environment
        run: |
          uv sync --group dev --all-extras
          uv pip install topoly==1.1.0
      - name: Prove RII reduction against unreduced exact state sum
        run: |
          uv run --no-sync python - <<'PY'
          import itertools
          import sympy as sp
          from dev.benchmark_topoly_extended_scaling import Case, _prepare, _seed_for
          from knotted_graph.invariants.yamada.fast import (
              FastNegamiSpecializedEvaluator,
              FastYamadaEvaluator,
              add,
              shift,
              to_sympy,
          )
          from knotted_graph.invariants.yamada.polynomial import (
              Yamada,
              _ordered_crossing_ports,
          )
          from knotted_graph.invariants.yamada.state_compact import PreparedCompactStateBuilder

          A = sp.Symbol('A')

          def state_sum(builder, evaluator):
              total = ()
              c = len(builder.crossing_ids)
              for config in itertools.product([0, 1, 2], repeat=c):
                  value = evaluator.compute_laurent(builder.build(config))
                  total = add(total, shift(value, config.count(0) - config.count(1)))
              return sp.expand(to_sympy(total, A))

          for method, evaluator_cls in [
              ('negami', FastNegamiSpecializedEvaluator),
              ('recursive', FastYamadaEvaluator),
          ]:
              for c in range(1, 11):
                  for sample in range(3):
                      case = Case('crossings_fixed', c)
                      seed = _seed_for(20260818, case.family, case.size, sample)
                      graph, processor, pd = _prepare(case, seed)
                      y = Yamada.from_PDCode(processor)
                      original = PreparedCompactStateBuilder.prepare(
                          y.vertices, y.crossings, y.arcs, _ordered_crossing_ports
                      )
                      reduced, moves = original.reduce_reidemeister_ii()
                      expected = state_sum(original, evaluator_cls())
                      actual = state_sum(reduced, evaluator_cls())
                      assert actual == expected, (
                          method, c, sample, moves, expected, actual, pd
                      )
                      expected_crossings = c % 2
                      assert len(reduced.crossing_ids) == expected_crossings, (
                          c, sample, moves, len(reduced.crossing_ids)
                      )
                      public = y.compute(A, normalize=False, n_jobs=1, method=method)
                      assert sp.expand(public) == expected
                      print(
                          f'PASS method={method} c={c} sample={sample} '
                          f'RII={moves} reduced_c={len(reduced.crossing_ids)}'
                      )
          PY
      - name: Run Yamada regression and fuzz suites
        run: |
          uv run --no-sync pytest -q tests/invariants/yamada
      - name: Run complete Python test suite
        run: |
          uv run --no-sync pytest -q
      - name: Benchmark crossing-heavy gain and generic-regression cost
        run: |
          uv run --no-sync python - <<'PY'
          import statistics
          import time
          import sympy as sp
          from dev.benchmark_topoly_extended_scaling import Case, _prepare, _seed_for
          from knotted_graph.invariants.yamada.polynomial import Yamada, _ordered_crossing_ports
          from knotted_graph.invariants.yamada.state_compact import PreparedCompactStateBuilder

          A = sp.Symbol('A')
          for c in [4, 8, 12, 20, 40, 80, 160, 320]:
              samples = []
              reduced_counts = []
              for sample in range(3):
                  case = Case('crossings_fixed', c)
                  seed = _seed_for(20260818, case.family, case.size, sample)
                  graph, processor, pd = _prepare(case, seed)
                  y = Yamada.from_PDCode(processor)
                  prepared = PreparedCompactStateBuilder.prepare(
                      y.vertices, y.crossings, y.arcs, _ordered_crossing_ports
                  )
                  reduced, moves = prepared.reduce_reidemeister_ii()
                  reduced_counts.append(len(reduced.crossing_ids))
                  start = time.perf_counter()
                  result = y.compute(A, normalize=False, n_jobs=1, method='negami')
                  samples.append(time.perf_counter() - start)
              print(
                  f'BENCH c={c} median={statistics.median(samples):.9f} '
                  f'reduced={reduced_counts}'
              )
          PY
      - name: Commit candidate only after exact regression gates pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/knotted_graph/invariants/yamada/state_compact.py src/knotted_graph/invariants/yamada/polynomial.py
          git diff --cached --check
          git commit -m "Cancel Reidemeister-II pairs before Yamada state expansion"
          git push origin HEAD:analysis/topoly-yamada-internals-20260818
