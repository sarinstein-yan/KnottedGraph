name: Yamada kernel breakthrough probe

on:
  pull_request:
    branches:
      - YAMADA_Optimization_LATEST
    paths:
      - "src/knotted_graph/invariants/yamada/diagram_frontier.py"
      - "src/knotted_graph/invariants/yamada/diagram_memo_dp.py"
      - "dev/benchmark_yamada_memo_dp_cycles.py"
      - "dev/benchmark_yamada_frontier_general.py"
      - ".github/workflows/yamada-kernel-breakthrough.yml"

permissions:
  contents: read

concurrency:
  group: yamada-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontier-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark environment
        run: uv sync --group dev --group benchmark
      - name: Require native backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available, native_import_error
          assert native_available(), native_import_error()
          PY
      - name: Hard LLLV cycle benchmark and small exact gate
        run: uv run --no-sync python dev/benchmark_yamada_memo_dp_cycles.py
      - name: Generic adaptive frontier probe
        run: uv run --no-sync python dev/benchmark_yamada_frontier_general.py
