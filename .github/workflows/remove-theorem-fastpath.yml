name: Remove theorem fast path from Yamada benchmark path

on:
  push:
    branches: [perf/yamada-max-optimization]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/yamada-max-optimization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove theorem shortcut and harden benchmark semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Public Yamada computation must never use the published theorem
          # as a computational shortcut. The theorem is reserved for validation.
          p = Path('src/knotted_graph/invariants/yamada/polynomial.py')
          text = p.read_text()
          start_marker = '        # Recognize theorem-backed Theta(n) diagrams before building the\n'
          end_marker = '        if theta_value is not None:\n            return theta_value\n\n'
          assert start_marker in text, 'polynomial.py theorem fast-path start not found'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          text = text[:start] + text[end:]
          p.write_text(text)

          # 2) Prepared/native dispatch must likewise remain generic.
          p = Path('src/knotted_graph/invariants/yamada/native.py')
          text = p.read_text()
          text = text.replace(
              'Prepared diagrams first pass through conservative exact structural fast paths.\n'
              'The certified Dobrynin--Vesnin Theta(n) family is evaluated by its published\n'
              'closed form. Other high-crossing diagrams may use exact skein/RII recursion\n'
              'before falling back to the legacy native ``3**c`` state sum. Small generic\n'
              'diagrams stay on the legacy C++ path because its constant factors are excellent.\n',
              'Prepared diagrams pass through exact size-aware generic structural dispatch.\n'
              'High-crossing diagrams may use exact skein/RII recursion before falling back\n'
              'to the legacy native ``3**c`` state sum. Small generic diagrams stay on the\n'
              'legacy C++ path because its constant factors are excellent. Published family\n'
              'formulae are deliberately excluded from timed production evaluation.\n',
          )
          start_marker = '        # First try the strongest possible optimization: a mathematically\n'
          end_marker = '            return theta_value\n\n'
          assert start_marker in text, 'native.py theorem fast-path start not found'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          text = text[:start] + text[end:]
          p.write_text(text)

          # 3) The theorem benchmark records generic-algorithm timeout/error rather
          # than aborting. Correctness is checked only when KG actually completes.
          p = Path('dev/benchmark_dobrynin_vesnin_theta_family.py')
          text = p.read_text()
          old = '''    if kg["status"] != "ok":
        raise AssertionError(f"KnottedGraph failed for Theta({n}): {kg}")
    if kg["terms"] != expected:
        raise AssertionError(
            f"KnottedGraph disagrees with published Theta({n}) formula: "
            f"KG={kg['terms']}, published={expected}"
        )
    row["knottedgraph_vs_published"] = "PASS"
'''
          new = '''    row["knottedgraph_algorithm"] = (
        "generic optimized Yamada evaluator; published theorem excluded from computation"
    )
    if kg["status"] == "ok":
        if kg["terms"] != expected:
            row["knottedgraph_vs_published"] = "FAIL"
        else:
            row["knottedgraph_vs_published"] = "PASS"
    else:
        row["knottedgraph_vs_published"] = "NOT_EVALUATED"
        row["knottedgraph_error"] = kg.get("error")
'''
          assert old in text, 'benchmark KG validation block not found'
          text = text.replace(old, new, 1)
          # Ratio only exists when both complete.
          old = '        row["topoly_over_knottedgraph"] = tp["time_s"] / kg["time_s"]\n'
          new = '''        if kg["status"] == "ok":
            row["topoly_over_knottedgraph"] = tp["time_s"] / kg["time_s"]
'''
          assert old in text
          text = text.replace(old, new, 1)
          p.write_text(text)

          # 4) Rewrite dispatch tests: theorem is an oracle, never a dispatch path.
          p = Path('tests/invariants/yamada/test_diagram_structural_dispatch.py')
          p.write_text(r'''from __future__ import annotations

import importlib.util
from pathlib import Path
import sys

import pytest

from knotted_graph.invariants.yamada.compact import PythonCompactYamadaEvaluator
from knotted_graph.invariants.yamada.diagram_structural import compute_structural_laurent
from knotted_graph.invariants.yamada.native import NativeCompactEvaluator, native_available
from knotted_graph.invariants.yamada.polynomial import Yamada, _ordered_crossing_ports
from knotted_graph.invariants.yamada.state_compact import PreparedCompactStateBuilder
from knotted_graph.projection import PDCode

ROOT = Path(__file__).resolve().parents[3]
TORUS_SCRIPT = ROOT / "dev" / "benchmark_topoly_essential_torus_scaling.py"
DV_SCRIPT = ROOT / "dev" / "benchmark_dobrynin_vesnin_theta_family.py"


def _load_module(path: Path, name: str):
    dev = ROOT / "dev"
    if str(dev) not in sys.path:
        sys.path.insert(0, str(dev))
    spec = importlib.util.spec_from_file_location(name, path)
    assert spec is not None and spec.loader is not None
    module = importlib.util.module_from_spec(spec)
    sys.modules[spec.name] = module
    spec.loader.exec_module(module)
    return module


def _prepared(n: int, *, mirror: bool = False):
    module = _load_module(TORUS_SCRIPT, "kg_essential_torus_test")
    if mirror:
        graph = module.essential_torus_graph(n)
        for _node, data in graph.nodes(data=True):
            data["pos"] = data["pos"].copy()
            data["pos"][2] *= -1.0
        for _u, _v, _key, data in graph.edges(keys=True, data=True):
            data["pts"] = data["pts"].copy()
            data["pts"][:, 2] *= -1.0
        processor = PDCode(graph)
        processor.compute(rotation_angles=(0.0, 0.0, 0.0))
        assert len(processor.crossings) == n
    else:
        _graph, processor, _pdcode = module.prepare_essential_torus(n)

    yamada = Yamada.from_PDCode(processor)
    prepared = PreparedCompactStateBuilder.prepare(
        yamada.vertices,
        yamada.crossings,
        yamada.arcs,
        _ordered_crossing_ports,
    )
    reduced, _moves = prepared.reduce_reidemeister_ii()
    assert len(reduced.crossing_ids) == n
    return reduced


@pytest.mark.parametrize("n", [3, 5, 7])
def test_structural_recursion_matches_independent_legacy_state_sum(n):
    """Generic structural recursion is exactly equal to the old 3**c implementation."""
    prepared = _prepared(n)
    evaluator = NativeCompactEvaluator(PythonCompactYamadaEvaluator)
    legacy = evaluator.compute_prepared_bulk_laurent(prepared)
    stats = {}
    structural = compute_structural_laurent(prepared, evaluator, stats=stats)
    assert structural == legacy
    assert stats["calls"] >= 1


@pytest.mark.parametrize("n", [3, 5, 7, 9, 11])
def test_generic_dispatch_matches_published_theta_oracle(n):
    """Production dispatch is generic; the published formula is only an external oracle."""
    assert native_available()
    prepared = _prepared(n)
    dv = _load_module(DV_SCRIPT, "kg_dv_formula_test")
    expected = tuple(sorted(dv.published_theta_terms(n).items()))

    evaluator = NativeCompactEvaluator(PythonCompactYamadaEvaluator)
    actual = evaluator.compute_prepared_laurent(prepared)
    assert actual == expected
    assert evaluator.theta_twist_calls == 0
    if n < 10:
        assert evaluator.structural_calls == 0
    else:
        assert evaluator.structural_calls == 1


@pytest.mark.parametrize("n", [3, 5])
def test_generic_dispatch_matches_legacy_for_mirror(n):
    """Generic production dispatch preserves exact output for mirrored diagrams."""
    assert native_available()
    prepared = _prepared(n, mirror=True)
    oracle = NativeCompactEvaluator(PythonCompactYamadaEvaluator)
    expected = oracle.compute_prepared_bulk_laurent(prepared)

    evaluator = NativeCompactEvaluator(PythonCompactYamadaEvaluator)
    actual = evaluator.compute_prepared_laurent(prepared)
    assert actual == expected
    assert evaluator.theta_twist_calls == 0
''')

          # 5) Give the generic evaluator enough room to expose its true scaling.
          p = Path('.github/workflows/dobrynin-vesnin-theta-family.yml')
          text = p.read_text()
          text = text.replace('--start 0 --stop 20 --timeout 60', '--start 0 --stop 20 --timeout 120')
          p.write_text(text)

          # Syntax validation of every modified Python file.
          for path in [
              Path('src/knotted_graph/invariants/yamada/polynomial.py'),
              Path('src/knotted_graph/invariants/yamada/native.py'),
              Path('dev/benchmark_dobrynin_vesnin_theta_family.py'),
              Path('tests/invariants/yamada/test_diagram_structural_dispatch.py'),
          ]:
              compile(path.read_text(), str(path), 'exec')

          # Guard against accidental reintroduction of theorem dispatch in production.
          assert 'certified_theta_twist_laurent' not in Path('src/knotted_graph/invariants/yamada/polynomial.py').read_text()
          assert 'certified_prepared_theta_twist_laurent' not in Path('src/knotted_graph/invariants/yamada/native.py').read_text()
          print('PASS: theorem formula is validation-only; production dispatch is generic.')
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/knotted_graph/invariants/yamada/polynomial.py \
                  src/knotted_graph/invariants/yamada/native.py \
                  dev/benchmark_dobrynin_vesnin_theta_family.py \
                  tests/invariants/yamada/test_diagram_structural_dispatch.py \
                  .github/workflows/dobrynin-vesnin-theta-family.yml
          if git diff --cached --quiet; then
            echo 'Already patched.'
          else
            git commit -m 'Use Dobrynin-Vesnin formula only as benchmark oracle'
            git push origin HEAD:perf/yamada-max-optimization
          fi
