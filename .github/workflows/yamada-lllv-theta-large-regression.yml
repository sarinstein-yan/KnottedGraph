name: Yamada LLLV theta large regression

on:
  pull_request:
    branches: [YAMADA_Optimization_LATEST]
  workflow_dispatch:

jobs:
  lllv-theta-ab:
    strategy:
      fail-fast: false
      matrix:
        n: [11, 12, 13, 14, 15]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare baseline worktree
        run: |
          git worktree add --detach ../yamada-family-base 28eddbfdc4cb21dd63e0faaaeb953a999bb2d8db
          cp dev/benchmark_yamada_family_regression_v2.py ../yamada-family-base/dev/benchmark_yamada_family_regression_v2.py
      - name: Baseline pre-v2 case
        working-directory: ../yamada-family-base
        run: |
          uv sync --group dev --group benchmark
          uv run --no-sync python dev/benchmark_yamada_family_regression_v2.py measure-case pre_v2 LLLV_THETA_S_VALUES "${{ matrix.n }}" /tmp/yamada-family-base.json
      - name: Current v2 case
        run: |
          uv sync --group dev --group benchmark
          uv run --no-sync python dev/benchmark_yamada_family_regression_v2.py measure-case v2 LLLV_THETA_S_VALUES "${{ matrix.n }}" /tmp/yamada-family-v2.json
      - name: Compare exact output and runtime
        run: |
          uv run --no-sync python dev/benchmark_yamada_family_regression_v2.py compare-case /tmp/yamada-family-base.json /tmp/yamada-family-v2.json
