name: Repair notebook environments

on:
  push:
    branches:
      - perf/yamada-max-optimization
    paths:
      - dev/normalize_notebook_environments.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize notebook environments
        run: python dev/normalize_notebook_environments.py

      - name: Validate normalized notebooks
        run: python dev/normalize_notebook_environments.py --check

      - name: Commit repaired notebooks
        shell: bash
        run: |
          if git diff --quiet -- User_guide; then
            echo "No notebook changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add User_guide
          git commit -m "Normalize notebook package environments"
          git push origin HEAD:perf/yamada-max-optimization
