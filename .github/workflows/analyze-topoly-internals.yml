name: Analyze Topoly Yamada internals

on:
  pull_request:
    branches:
      - perf/yamada-max-optimization
  push:
    branches:
      - analysis/topoly-yamada-internals-20260818

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark environment
        run: |
          uv sync --group dev --all-extras
          uv pip install topoly==1.1.0
      - name: Inspect Topoly Yamada and Reidemeister implementation
        run: |
          uv run --no-sync python - <<'PY'
          import inspect
          import topoly.invariants as inv
          import topoly.graph as graph_module

          print('YAMADA_POINT=')
          print(inspect.getsource(inv.YamadaGraph.point))
          print('YAMADA_MAKE_SKEIN=')
          print(inspect.getsource(inv.YamadaGraph.make_skein))
          print('YAMADA_REMOVE_CROSSING=')
          print(inspect.getsource(inv.YamadaGraph.remove_crossing))

          Graph = graph_module.Graph
          for name in [
              'simplify_reidemeister',
              'simplify_reidemeister_deterministic',
              'find_reidemeister_2',
              'reidemeister_2',
              'find_reidemeister_1',
              'reidemeister_1',
              'find_reidemeister_1v',
              'reidemeister_1v',
              'find_reidemeister_2v',
              'reidemeister_2v',
              'find_reidemeister_4',
              'reidemeister_4',
              'find_reidemeister_5',
              'reidemeister_5',
          ]:
              if hasattr(Graph, name):
                  print(f'GRAPH_{name}=')
                  print(inspect.getsource(getattr(Graph, name)))
          PY
      - name: Measure simplification on fixed crossing family
        run: |
          uv run --no-sync python - <<'PY'
          from dev.benchmark_topoly_extended_scaling import Case, _prepare, _seed_for
          from topoly.invariants import Invariant, YamadaGraph

          for c in [1, 2, 3, 4, 5, 8, 12, 20, 40, 80]:
              case = Case('crossings_fixed', c)
              seed = _seed_for(20260818, case.family, case.size, 0)
              graph, processor, pd = _prepare(case, seed)
              tg = YamadaGraph(pd)
              before = len(tg.crossings)
              n = tg.simplify_reidemeister(debug=False)
              after = len(tg.crossings)
              simplified_pd = tg.pdcode
              Invariant.known['Yamada'] = {}
              result = YamadaGraph(pd).point(max_cross=5000)
              print(
                  f'CASE c={c} before={before} after={after} R1_factor_count={n} '
                  f'pd_before_len={len(pd)} pd_after_len={len(simplified_pd)} '
                  f'terms={len(result.term)} simplified_pd={simplified_pd}'
              )
          PY
