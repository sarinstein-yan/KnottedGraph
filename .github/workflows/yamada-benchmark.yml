name: Yamada benchmark

on:
  pull_request:
    paths:
      - "src/knotted_graph/invariants/yamada/**"
      - "src/knotted_graph/projection/**"
      - "dev/benchmark_yamada_kernel.py"
      - "dev/benchmark_yamada_compare.py"
      - ".github/workflows/yamada-benchmark.yml"

permissions:
  contents: read

jobs:
  kernel-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install environment
        run: uv sync --group dev
      - name: Compare retained SymPy evaluators with exact Laurent kernels
        run: uv run --no-sync python dev/benchmark_yamada_kernel.py

  topoly-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install environment and Topoly
        run: |
          uv sync --group dev
          uv pip install topoly
      - name: Confirm Topoly benchmark dependency
        run: |
          uv run --no-sync python - <<'PY'
          import topoly
          print("Topoly imported:", topoly.__file__)
          PY
