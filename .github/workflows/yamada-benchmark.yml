name: Yamada benchmark

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "src/knotted_graph/invariants/yamada/**"
      - "src/knotted_graph/projection/**"
      - "src/knotted_graph/applications/nodal/**"
      - "src/knotted_graph/extraction/**"
      - "src/knotted_graph/core/**"
      - "dev/run_yamada_sanity_checks.py"
      - "dev/run_skeletonization_45_validation.py"
      - "dev/benchmark_topoly_extended_scaling.py"
      - "dev/benchmark_topoly_random_cubic_ensemble.py"
      - "dev/generate_topoly_random_cubic_corpus.py"
      - "dev/benchmark_data/topoly_random_cubic_v1.jsonl"
      - "tests/benchmarks/test_topoly_paper_setup.py"
      - "User_guide/benchmarks/01_sanity_checks.ipynb"
      - "User_guide/benchmarks/02_application_output_regression.ipynb"
      - "User_guide/benchmarks/03_knottedgraph_vs_topoly_scaling_final_push.ipynb"
      - "User_guide/benchmarks/04_synthetic_ground_truth_validation.ipynb"
      - "User_guide/benchmarks/06_paper_scaling_publication_figure_final_push.ipynb"
      - ".github/workflows/yamada-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-yamada:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development environment
        run: uv sync --group dev
      - name: Require production native backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available
          assert native_available(), "native backend was not built"
          print("production native Yamada backend: active")
          PY
      - name: Run exact Yamada invariant tests
        run: uv run --no-sync pytest -q tests/invariants/yamada
      - name: Run published and independent exact sanity checks
        run: uv run --no-sync python dev/run_yamada_sanity_checks.py

  validation-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        notebook:
          - User_guide/benchmarks/01_sanity_checks.ipynb
          - User_guide/benchmarks/02_application_output_regression.ipynb
          - User_guide/benchmarks/04_synthetic_ground_truth_validation.ipynb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install complete notebook environment
        run: uv sync --extra all --group dev --group benchmark
      - name: Require production native backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available
          assert native_available(), "native backend was not built"
          PY
      - name: Execute validation notebook
        env:
          PYTHONNOUSERSITE: "1"
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: "true"
          PLOTLY_RENDERER: json
        run: uv run --no-sync python dev/execute_notebook.py "${{ matrix.notebook }}" --timeout 7200

  skeletonization-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install complete application environment
        run: uv sync --extra all --group dev
      - name: Validate optimized extraction against 45 known graph truths
        run: uv run --no-sync python dev/run_skeletonization_45_validation.py
      - name: Run nodal regression tests
        run: uv run --no-sync pytest -q tests/applications/test_nodal_regressions.py
      - name: Run the sole historical output-regression exception
        env:
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: "true"
        run: uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/02_application_output_regression.ipynb --timeout 7200

  topoly-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install environment and Topoly
        run: uv sync --group dev --group benchmark
      - name: Require production native backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available
          assert native_available()
          PY
      - name: Validate paper benchmark design
        run: uv run --no-sync pytest -q tests/benchmarks/test_topoly_paper_setup.py
      - name: Smoke-test controlled identical-PD ensemble scaling
        run: uv run --no-sync python dev/benchmark_topoly_extended_scaling.py --profile smoke --embeddings 2 --timeout 10
      - name: Smoke-test heterogeneous connected-cubic ensemble
        run: uv run --no-sync python dev/benchmark_topoly_random_cubic_ensemble.py --profile smoke --samples-per-v 2 --timeout 10
