name: Yamada theta discovery

on:
  pull_request:
    paths:
      - "dev/discover_yamada_theta_collisions.py"
      - "dev/run_theta_collision_frontier_search.py"
      - ".github/workflows/yamada-theta-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier-search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KnottedGraph discovery environment
        run: uv sync --group dev
      - name: Require production native Yamada backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available
          assert native_available(), "native Yamada backend is required"
          PY
      - name: Build plantri 5.8 from the authors' release
        run: |
          curl -fsSLo /tmp/plantri58.tar.gz https://users.cecs.anu.edu.au/~bdm/plantri/plantri58.tar.gz
          mkdir -p /tmp/plantri-src
          tar -xzf /tmp/plantri58.tar.gz -C /tmp/plantri-src --strip-components=1
          cc -O3 -o /tmp/plantri /tmp/plantri-src/plantri.c
      - name: Smoke-test admissible theta reconstruction at seven crossings
        run: |
          uv run --no-sync python dev/run_theta_collision_frontier_search.py \
            --plantri /tmp/plantri \
            --crossings 7 \
            --limit-shadows 2 \
            --limit-assignments 8 \
            --output research_results/theta7_smoke.json
      - name: Exhaustively search all admissible eight-crossing theta shadows
        run: |
          uv run --no-sync python dev/run_theta_collision_frontier_search.py \
            --plantri /tmp/plantri \
            --crossings 8 \
            --output research_results/theta8_yamada_search.json
      - name: Upload exact discovery corpus
        uses: actions/upload-artifact@v4
        with:
          name: theta8-yamada-discovery
          path: research_results/*.json
          if-no-files-found: error
