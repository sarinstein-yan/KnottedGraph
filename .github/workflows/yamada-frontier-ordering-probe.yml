name: Yamada frontier ordering probe

on:
  pull_request:
    branches:
      - YAMADA_Optimization_LATEST
    paths:
      - "dev/benchmark_yamada_frontier_ordering_probe.py"
      - ".github/workflows/yamada-frontier-ordering-probe.yml"

permissions:
  contents: read

jobs:
  ordering-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev --group benchmark
      - name: Compare current greedy with multistart greedy
        run: uv run --no-sync python dev/benchmark_yamada_frontier_ordering_probe.py
