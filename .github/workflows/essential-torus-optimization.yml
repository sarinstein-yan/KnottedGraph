name: Essential torus Yamada optimization

on:
  pull_request:
    paths:
      - "src/knotted_graph/invariants/yamada/**"
      - "dev/benchmark_topoly_essential_torus_scaling.py"
      - "dev/benchmark_topoly_essential_torus_gate.py"
      - "tests/invariants/yamada/test_diagram_structural_dispatch.py"
      - ".github/workflows/essential-torus-optimization.yml"

permissions:
  contents: read

jobs:
  exactness-and-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply generic-only optimization candidates
        run: |
          python - <<'PY'
          from pathlib import Path

          # The published theorem is an oracle only, never part of timed KG.
          p = Path('src/knotted_graph/invariants/yamada/polynomial.py')
          s = p.read_text()
          marker0 = '        # Recognize theorem-backed Theta(n) diagrams before building the\n'
          if marker0 in s:
              a = s.index(marker0)
              marker1 = '        if theta_value is not None:\n            return theta_value\n\n'
              b = s.index(marker1, a) + len(marker1)
              p.write_text(s[:a] + s[b:])

          p = Path('src/knotted_graph/invariants/yamada/native.py')
          s = p.read_text()
          marker0 = '        # First try the strongest possible optimization: a mathematically\n'
          if marker0 in s:
              a = s.index(marker0)
              marker1 = '            return theta_value\n\n'
              b = s.index(marker1, a) + len(marker1)
              s = s[:a] + s[b:]
          s = s.replace('STRUCTURAL_DISPATCH_MIN_CROSSINGS = 10', 'STRUCTURAL_DISPATCH_MIN_CROSSINGS = 8')
          p.write_text(s)

          # Stop heuristic search at the first exact reducing move.
          p = Path('src/knotted_graph/invariants/yamada/skein_hybrid.py')
          s = p.read_text()
          old = '''def _best_inversion(prepared):
    best = None
    for crossing_index in range(len(prepared.crossing_ids)):
        inverted = invert_crossing(prepared, crossing_index)
        reduced, moves = inverted.reduce_reidemeister_ii()
        if moves and (best is None or moves > best[0]):
            best = moves, crossing_index, reduced
    return best
'''
          new = '''def _best_inversion(prepared):
    for crossing_index in range(len(prepared.crossing_ids)):
        inverted = invert_crossing(prepared, crossing_index)
        reduced, moves = inverted.reduce_reidemeister_ii()
        if moves:
            return moves, crossing_index, reduced
    return None
'''
          if old in s:
              s = s.replace(old, new)
          old = '''def _best_resolution(prepared):
    """Find a crossing whose ordinary resolutions expose additional RII moves."""
    best = None
    crossing_count = len(prepared.crossing_ids)
    for crossing_index in range(crossing_count):
        children = []
        extra_moves = 0
        try:
            for spin in (0, 1, 2):
                child = resolve_crossing(prepared, crossing_index, spin)
                reduced, moves = child.reduce_reidemeister_ii()
                children.append(reduced)
                extra_moves += moves
        except ValueError:
            continue
        if extra_moves and (best is None or extra_moves > best[0]):
            best = extra_moves, crossing_index, tuple(children)
    return best
'''
          new = '''def _best_resolution(prepared):
    """Return the first crossing whose exact resolutions expose RII moves."""
    crossing_count = len(prepared.crossing_ids)
    for crossing_index in range(crossing_count):
        children = []
        extra_moves = 0
        try:
            for spin in (0, 1, 2):
                child = resolve_crossing(prepared, crossing_index, spin)
                reduced, moves = child.reduce_reidemeister_ii()
                children.append(reduced)
                extra_moves += moves
        except ValueError:
            continue
        if extra_moves:
            return extra_moves, crossing_index, tuple(children)
    return None
'''
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)

          # Find RII candidates from physical adjacency rather than O(c^2) pair scanning.
          p = Path('src/knotted_graph/invariants/yamada/state_compact.py')
          s = p.read_text()
          a = s.index('    def _find_reidemeister_ii_pair(self):\n')
          b = s.index('    def _remove_reidemeister_ii_pair', a)
          replacement = '''    def _find_reidemeister_ii_pair(self):
        """Return one conservatively recognized Reidemeister-II crossing pair."""
        arc_partner = self.arc_partner
        crossing_for_port = self.crossing_for_port
        ordered_ports = self.ordered_ports
        for first, first_ports in enumerate(ordered_ports):
            by_second = {}
            for first_position, first_port in enumerate(first_ports):
                partner = arc_partner[first_port]
                second = crossing_for_port[partner]
                if second < 0 or second >= first:
                    continue
                by_second.setdefault(second, []).append((first_position, partner))
            for second, links in by_second.items():
                if len(links) != 2:
                    continue
                second_ports = ordered_ports[second]
                second_position = {port: i for i, port in enumerate(second_ports)}
                shared = []
                for first_position, partner in links:
                    pos = second_position.get(partner)
                    if pos is None:
                        break
                    shared.append((first_position, pos))
                if len(shared) != 2:
                    continue
                if (shared[0][0] - shared[1][0]) % 4 not in (1, 3):
                    continue
                if (shared[0][1] - shared[1][1]) % 4 not in (1, 3):
                    continue
                if any((x % 2) != (y % 2) for x, y in shared):
                    continue
                removed = set(first_ports) | set(second_ports)
                splices = []
                valid = True
                for first_position, second_position_index in shared:
                    first_external = first_ports[(first_position + 2) % 4]
                    second_external = second_ports[(second_position_index + 2) % 4]
                    remote_first = arc_partner[first_external]
                    remote_second = arc_partner[second_external]
                    if remote_first in removed or remote_second in removed or remote_first == remote_second:
                        valid = False
                        break
                    splices.append((remote_first, remote_second))
                if valid and len({port for pair in splices for port in pair}) == 4:
                    return first, second, tuple(splices)
        return None

'''
          p.write_text(s[:a] + replacement + s[b:])

          for f in ('polynomial.py','native.py','skein_hybrid.py','state_compact.py'):
              q = Path('src/knotted_graph/invariants/yamada') / f
              compile(q.read_text(), str(q), 'exec')
          print('generic-only candidate patch ready')
          PY

      - name: Install benchmark environment
        run: uv sync --group dev --group benchmark

      - name: Require native Yamada backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available, native_import_error
          print("native:", native_available())
          assert native_available(), native_import_error()
          PY

      - name: Exact structural-dispatch tests
        run: >
          uv run --no-sync pytest -q
          tests/invariants/yamada/test_reidemeister_ii_preprocessing.py
          tests/invariants/yamada/test_diagram_structural_dispatch.py
          tests/invariants/yamada/test_skein_hybrid_candidate.py
          tests/invariants/yamada/test_native_prepared_state_sum.py

      - name: Published and independent Yamada sanity checks
        run: uv run --no-sync python dev/run_yamada_sanity_checks.py

      - name: Generic KG versus Topoly on certified odd Theta family
        run: >
          uv run --no-sync python dev/benchmark_topoly_essential_torus_gate.py
          --n-values 3,5,7,9,11,13,15,17,19
          --repeats 3
          --timeout 30
          --require-faster
