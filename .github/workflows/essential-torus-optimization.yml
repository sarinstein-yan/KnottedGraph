name: Essential torus Yamada optimization

on:
  pull_request:
    paths:
      - "src/knotted_graph/invariants/yamada/**"
      - "dev/benchmark_topoly_essential_torus_scaling.py"
      - "dev/benchmark_topoly_essential_torus_gate.py"
      - "tests/invariants/yamada/test_diagram_structural_dispatch.py"
      - ".github/workflows/essential-torus-optimization.yml"

permissions:
  contents: read

jobs:
  exactness-and-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark environment
        run: uv sync --group dev --group benchmark

      - name: Require native Yamada backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available, native_import_error
          print("native:", native_available())
          print("error:", native_import_error())
          assert native_available(), native_import_error()
          PY

      - name: Exact structural-dispatch tests
        run: >
          uv run --no-sync pytest -q
          tests/invariants/yamada/test_diagram_structural_dispatch.py
          tests/invariants/yamada/test_skein_hybrid_candidate.py
          tests/invariants/yamada/test_native_prepared_state_sum.py
          tests/invariants/yamada/test_state_streaming_regression.py

      - name: Published and independent Yamada sanity checks
        run: uv run --no-sync python dev/run_yamada_sanity_checks.py

      - name: Repeated T(2,n) comparison through n=19
        run: >
          uv run --no-sync python dev/benchmark_topoly_essential_torus_gate.py
          --n-values 3,5,7,9,11,13,15,17,19
          --repeats 3
          --timeout 30
          --require-faster
