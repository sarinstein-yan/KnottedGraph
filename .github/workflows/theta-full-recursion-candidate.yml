name: Theta full recursion candidate

on:
  pull_request:
    branches: [Latest_Workplace]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/yamada-max-optimization
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --group dev --group benchmark
      - name: Require native backend
        run: uv run --no-sync python -c "from knotted_graph.invariants.yamada.native import native_available; assert native_available()"
      - name: Benchmark exact R1-reduced generic recursion
        run: uv run --no-sync python dev/benchmark_r1_optimized_recursion.py
