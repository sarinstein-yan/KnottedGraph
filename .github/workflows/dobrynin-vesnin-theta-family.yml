name: Dobrynin-Vesnin Theta family validation

on:
  pull_request:
    branches: [Latest_Workplace]
  workflow_dispatch:

jobs:
  theta-family-0-20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/yamada-max-optimization
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark environment
        run: uv sync --group dev --group benchmark
      - name: Require native Yamada backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available, native_import_error
          assert native_available(), native_import_error()
          PY
      - name: Compare Theta(n), n=0..20, to published theorem and Topoly
        run: uv run --no-sync python dev/benchmark_dobrynin_vesnin_theta_family.py --start 0 --stop 20 --timeout 60
