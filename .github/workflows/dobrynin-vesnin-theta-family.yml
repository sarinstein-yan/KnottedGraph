name: Dobrynin-Vesnin Theta family validation

on:
  pull_request:
    branches: [YAMADA_Optimization_LATEST]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theta-family-0-20:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark environment
        run: uv sync --group dev --group benchmark
      - name: Require final factorized backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available, native_import_error
          from knotted_graph.invariants.yamada.factorized_frontier import native_factorized_available
          assert native_available(), native_import_error()
          assert native_factorized_available()
          PY
      - name: Exact factorized regression tests
        run: >
          uv run --no-sync pytest -q
          tests/invariants/yamada/test_diagram_unified.py
          tests/invariants/yamada/test_block_factorization_equivalence.py
      - name: Benchmark public KG and Topoly against Theorem 2 through n=20
        run: uv run --no-sync python dev/benchmark_dobrynin_vesnin_theta_family.py --start 0 --stop 20 --timeout 25
