name: Goal Yamada torus release gate

on:
  push:
    branches:
      - perf/yamada-max-optimization
    paths:
      - "src/knotted_graph/invariants/yamada/**"
      - "dev/benchmark_topoly_essential_torus_scaling.py"
      - "dev/yamada_output_fingerprint.py"
      - "dev/run_yamada_sanity_checks.py"
      - "dev/application_yamada_regression.py"
      - "User_guide/benchmarks/01_sanity_checks.ipynb"
      - "User_guide/benchmarks/02_application_output_regression.ipynb"
      - ".github/workflows/goal-yamada-torus-release-gate.yml"

permissions:
  contents: read

concurrency:
  group: goal-yamada-torus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install full benchmark environment
        run: uv sync --extra all --group dev --group benchmark --group docs

      - name: Require native Yamada backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available, native_import_error
          print("native:", native_available())
          print("error:", native_import_error())
          assert native_available(), native_import_error()
          PY

      - name: Print structural-recursion diagnostics on T(2,n)
        run: |
          uv run --no-sync python - <<'PY'
          from dev.benchmark_topoly_essential_torus_scaling import prepare_essential_torus
          from knotted_graph.invariants.yamada.fast import FastNegamiSpecializedEvaluator
          from knotted_graph.invariants.yamada.polynomial import Yamada

          for n in (3,5,7,9,11,13,15,17,19):
              graph, processor, pdcode = prepare_essential_torus(n)
              y = Yamada(
                  list(processor.vertices.values()),
                  list(processor.crossings.values()),
                  list(processor.arcs.values()),
              )
              evaluator = FastNegamiSpecializedEvaluator()
              prepared = y._prepare_compact_state_builder()
              value = evaluator.compute_prepared_laurent(prepared)
              print(
                  "STRUCTURAL",
                  n,
                  "terms=", len(value),
                  "stats=", getattr(evaluator, "last_structural_stats", None),
                  flush=True,
              )
          PY

      - name: Benchmark every odd certified crossing count through 19
        run: |
          set -o pipefail
          uv run --no-sync python dev/benchmark_topoly_essential_torus_scaling.py \
            --n-values 3,5,7,9,11,13,15,17,19 \
            --timeout 60 \
            --censor-frontier 2 | tee /tmp/torus.txt

      - name: Require correctness and KnottedGraph win at every torus case
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          lines = Path('/tmp/torus.txt').read_text().splitlines()
          summary_line = next(line for line in reversed(lines) if line.startswith('SUMMARY='))
          rows = json.loads(summary_line[len('SUMMARY='):])
          expected = [3,5,7,9,11,13,15,17,19]
          got = [int(row['certified_min_crossings']) for row in rows]
          assert got == expected, (got, expected)
          failures = []
          for row in rows:
              n = int(row['certified_min_crossings'])
              if row.get('correctness') != 'PASS':
                  failures.append((n, 'correctness', row.get('correctness')))
                  continue
              if row.get('knottedgraph_status') != 'ok' or row.get('topoly_status') != 'ok':
                  failures.append((n, 'status', row.get('knottedgraph_status'), row.get('topoly_status')))
                  continue
              kg = float(row['knottedgraph_s'])
              tp = float(row['topoly_s'])
              ratio = tp / kg
              print(f'T(2,{n}): KG={kg:.6f}s Topoly={tp:.6f}s Topoly/KG={ratio:.2f}x')
              if not kg < tp:
                  failures.append((n, 'performance', kg, tp))
          assert not failures, failures
          print('PASS: KnottedGraph beats Topoly at every odd T(2,n), n=3..19, with exact polynomial agreement.')
          PY

      - name: Fingerprint optimized branch
        run: uv run --no-sync python dev/yamada_output_fingerprint.py > /tmp/optimized-fingerprint.json

      - name: Fingerprint Latest_Workplace reference
        run: |
          git worktree add /tmp/KnottedGraph-reference origin/Latest_Workplace
          cd /tmp/KnottedGraph-reference
          uv sync --group dev
          uv run --no-sync python "$GITHUB_WORKSPACE/dev/yamada_output_fingerprint.py" > /tmp/reference-fingerprint.json

      - name: Require byte-identical public outputs
        run: diff -u /tmp/reference-fingerprint.json /tmp/optimized-fingerprint.json

      - name: Run published and independent sanity checks
        run: uv run --no-sync python dev/run_yamada_sanity_checks.py

      - name: Execute sanity-check notebook
        env:
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: "true"
        run: uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/01_sanity_checks.ipynb --timeout 7200

      - name: Execute application-output regression notebook
        env:
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: "true"
        run: uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/02_application_output_regression.ipynb --timeout 7200
