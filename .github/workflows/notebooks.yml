name: User-guide notebooks

on:
  pull_request:
    branches: [Latest_Workplace]
  workflow_dispatch:

jobs:
  execute-notebook:
    name: ${{ matrix.notebook }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        notebook:
          - User_guide/00_user_guide.ipynb
          - User_guide/01_getting_started.ipynb
          - User_guide/02_core_workflows.ipynb
          - User_guide/03_advanced_and_reproduction.ipynb
          - User_guide/applications/01_physics_applications.ipynb
          - User_guide/applications/02_mathematics_applications.ipynb
          - User_guide/applications/03_protein_applications.ipynb
          - User_guide/benchmarks/01_sanity_checks.ipynb
          - User_guide/benchmarks/02_application_output_regression.ipynb
          - User_guide/benchmarks/03_knottedgraph_vs_topoly_scaling.ipynb

    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install full notebook environment
        run: |
          uv sync --extra all --group dev --group docs
          uv pip install topoly

      - name: Verify branch-local import
        run: |
          PYTHONPATH="$PWD/src" uv run --no-sync python - <<'PY'
          from pathlib import Path
          import knotted_graph
          root = Path.cwd().resolve()
          path = Path(knotted_graph.__file__).resolve()
          print(path)
          assert root / "src" in path.parents
          PY

      - name: Execute notebook
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PYTHONNOUSERSITE: '1'
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: 'true'
          PLOTLY_RENDERER: json
        run: |
          uv run --no-sync python dev/execute_notebook.py "${{ matrix.notebook }}" --timeout 7200
