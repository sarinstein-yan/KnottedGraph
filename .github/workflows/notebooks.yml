name: User-guide notebooks

on:
  pull_request:
    branches: [Latest_Workplace]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  normalize-notebooks:
    name: Normalize notebook environments
    runs-on: ubuntu-24.04
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize notebooks
        run: python dev/normalize_notebook_environments.py

      - name: Validate normalized notebooks
        run: python dev/normalize_notebook_environments.py --check

      - name: Commit normalized notebooks when needed
        shell: bash
        run: |
          if git diff --quiet -- User_guide; then
            echo "Notebook environments already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add User_guide
          git commit -m "Normalize notebook package environments"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"

  execute-notebook:
    name: ${{ matrix.notebook }}
    needs: normalize-notebooks
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        notebook:
          - User_guide/00_user_guide.ipynb
          - User_guide/01_getting_started.ipynb
          - User_guide/02_core_workflows.ipynb
          - User_guide/03_advanced_and_reproduction.ipynb
          - User_guide/applications/01_physics_applications.ipynb
          - User_guide/applications/02_mathematics_applications.ipynb
          - User_guide/applications/03_protein_applications.ipynb
          - User_guide/benchmarks/01_sanity_checks.ipynb
          - User_guide/benchmarks/02_application_output_regression.ipynb
          - User_guide/benchmarks/03_knottedgraph_vs_topoly_scaling_final_push.ipynb
          - User_guide/benchmarks/04_synthetic_ground_truth_validation.ipynb
          - User_guide/benchmarks/05_same_abstract_graph_distinct_embeddings.ipynb
          - User_guide/benchmarks/06_paper_scaling_publication_figure_final_push.ipynb

    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install full notebook environment
        run: |
          uv sync --extra all --group dev --group docs --group benchmark

      - name: Verify installed package and native Yamada backend
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import sys
          import knotted_graph
          from knotted_graph.invariants.yamada.native import native_available, native_import_error
          print("Python:", sys.executable)
          print("KnottedGraph:", Path(knotted_graph.__file__).resolve())
          print("Native Yamada backend:", native_available())
          print("Native import error:", native_import_error())
          assert native_available(), native_import_error()
          PY

      - name: Audit notebook portability and environment semantics
        run: |
          uv run --no-sync python dev/validate_notebook_portability.py
          uv run --no-sync python dev/normalize_notebook_environments.py --check

      - name: Execute notebook
        env:
          PYTHONNOUSERSITE: '1'
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: 'true'
          PLOTLY_RENDERER: json
        run: |
          uv run --no-sync python dev/execute_notebook.py "${{ matrix.notebook }}" --timeout 7200
