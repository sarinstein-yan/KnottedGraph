name: Yamada theta symmetric-quandle certification

on:
  pull_request:
    paths:
      - "dev/certify_theta_symmetric_quandle.py"
      - "dev/certify_theta_symmetric_quandle_v2.py"
      - "dev/certify_theta_symmetric_quandle_v3.py"
      - "dev/validate_theta_symmetric_quandle_invariance.py"
      - "dev/validate_theta_symmetric_quandle_invariance_v2.py"
      - "dev/validate_theta_symmetric_quandle_invariance_v3.py"
      - ".github/workflows/yamada-theta-symmetric-quandle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symmetric-quandle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research environment
        run: uv sync --group dev --group benchmark
      - name: Build plantri 5.8
        run: |
          curl -fsSLo /tmp/plantri58.tar.gz https://users.cecs.anu.edu.au/~bdm/plantri/plantri58.tar.gz
          mkdir -p /tmp/plantri-src
          tar -xzf /tmp/plantri58.tar.gz -C /tmp/plantri-src --strip-components=1
          cc -O3 -o /tmp/plantri /tmp/plantri-src/plantri.c
      - name: Compute exact symmetric-quandle coloring invariants
        run: |
          uv run --no-sync python dev/certify_theta_symmetric_quandle_v3.py \
            --plantri /tmp/plantri \
            --output research_results/theta8_symmetric_quandle.json
      - name: Stress-test projection invariance and standard theta
        run: |
          uv run --no-sync python dev/validate_theta_symmetric_quandle_invariance_v3.py \
            --plantri /tmp/plantri \
            --output research_results/theta8_symmetric_quandle_validation.json
      - name: Upload certificate
        uses: actions/upload-artifact@v4
        with:
          name: theta8-symmetric-quandle
          path: |
            research_results/theta8_symmetric_quandle.json
            research_results/theta8_symmetric_quandle_validation.json
          if-no-files-found: error
