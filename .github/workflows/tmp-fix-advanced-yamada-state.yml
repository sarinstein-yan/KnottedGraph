name: Temporary advanced Yamada state notebook repair

on:
  push:
    branches:
      - audit/yamada-finalization-20260822

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/yamada-finalization-20260822
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair current CompactGraph notebook usage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('User_guide/03_advanced_and_reproduction.ipynb')
          nb = json.loads(path.read_text())
          changed = False
          for cell in nb.get('cells', []):
              if cell.get('cell_type') != 'code':
                  continue
              source = ''.join(cell.get('source', []))
              new = source.replace(
                  'state_graph.number_of_nodes(), state_graph.number_of_edges()',
                  'state_graph.n, state_graph.edge_count',
              )
              # CompactGraph is not a NetworkX input. Materialize a small display-only
              # graph from its multiplicity matrix when plotting diagnostic states.
              new = new.replace(
                  'simple_state = nx.Graph(state_graph)',
                  'simple_state = nx.Graph()\n'
                  '    simple_state.add_nodes_from(range(state_graph.n))\n'
                  '    for i in range(state_graph.n):\n'
                  '        for j in range(i, state_graph.n):\n'
                  '            if state_graph.rows[i][j]:\n'
                  '                simple_state.add_edge(i, j)',
              )
              if new != source:
                  cell['source'] = [line + '\n' for line in new.rstrip('\n').splitlines()]
                  changed = True
          kgmeta = nb.setdefault('metadata', {}).get('knotted_graph')
          if isinstance(kgmeta, dict) and kgmeta.get('based_on_branch') == 'Latest_Workplace':
              kgmeta['based_on_branch'] = 'YAMADA_Optimization_LATEST'
              changed = True
          if not changed:
              raise RuntimeError('Expected stale CompactGraph/metadata notebook usage was not found')
          path.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + '\n')
          PY
          rm .github/workflows/tmp-fix-advanced-yamada-state.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add User_guide/03_advanced_and_reproduction.ipynb .github/workflows/tmp-fix-advanced-yamada-state.yml
          git commit -m 'Update advanced notebook for CompactGraph states'
          git push origin HEAD:audit/yamada-finalization-20260822
