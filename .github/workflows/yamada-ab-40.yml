name: Yamada LLLV cycle 10-11 A/B

on:
  pull_request:
    branches:
      - YAMADA_Optimization_LATEST
    paths:
      - "dev/benchmark_yamada_ab_40.py"
      - ".github/workflows/yamada-ab-40.yml"

permissions:
  contents: read

jobs:
  ab-cycle-10-11:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baseline cycle 10 and 11
        run: |
          git worktree add --detach ../ab-base 5cd2776c3840ac7b7ac7eb5979b0e4e6b8d3dd11
          cp dev/benchmark_yamada_ab_40.py ../ab-base/dev/benchmark_yamada_ab_40.py
          cd ../ab-base
          uv sync --group dev --group benchmark
          uv run --no-sync python dev/benchmark_yamada_ab_40.py run baseline /tmp/ab-base.json
      - name: Latest cycle 10 and 11
        run: |
          git worktree add --detach ../ab-latest 63190fef71ba205da9b9c977c20c9b5909ec0154
          cp dev/benchmark_yamada_ab_40.py ../ab-latest/dev/benchmark_yamada_ab_40.py
          cd ../ab-latest
          uv sync --group dev --group benchmark
          uv run --no-sync python dev/benchmark_yamada_ab_40.py run latest /tmp/ab-latest.json
      - name: Compare exact outputs and timings
        run: |
          cd ../ab-latest
          uv run --no-sync python dev/benchmark_yamada_ab_40.py compare /tmp/ab-base.json /tmp/ab-latest.json
