name: Temporary hard source inspector

on:
  push:
    branches:
      - diagnostic/hard-source-inspect-20260822

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect hard runner source
        run: python dev/_tmp_hard_source_inspect.py
