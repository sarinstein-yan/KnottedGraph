name: Yamada old branch n15 A/B

on:
  pull_request:
    branches: [YAMADA_Optimization_LATEST]
  workflow_dispatch:

jobs:
  old-branch-ab:
    strategy:
      fail-fast: false
      matrix:
        family: [THETA_N_VALUES, LLLV_CYCLE_N_VALUES, LLLV_THETA_S_VALUES]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare old optimization worktree
        run: |
          git worktree add --detach ../yamada-old origin/perf/yamada-max-optimization
          cp dev/benchmark_yamada_family_regression_v2.py ../yamada-old/dev/benchmark_yamada_family_regression_v2.py
      - name: Old optimization branch n15
        working-directory: ../yamada-old
        run: |
          uv sync --group dev --group benchmark
          uv run --no-sync python dev/benchmark_yamada_family_regression_v2.py measure-case old_perf "${{ matrix.family }}" 15 /tmp/yamada-old.json
      - name: Current production n15
        run: |
          uv sync --group dev --group benchmark
          uv run --no-sync python dev/benchmark_yamada_family_regression_v2.py measure-case current "${{ matrix.family }}" 15 /tmp/yamada-current.json
      - name: Compare exact output and runtime
        run: |
          uv run --no-sync python dev/benchmark_yamada_family_regression_v2.py compare-case /tmp/yamada-old.json /tmp/yamada-current.json
