name: Skeletonization optimization validation

on:
  push:
    branches:
      - Skeltonization_optimization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skeletonization-optimization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install complete validation environment
        run: uv sync --extra all --group dev --group docs --group benchmark

      - name: Verify native Yamada backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available, native_import_error
          print('native Yamada backend:', native_available())
          print('native import error:', native_import_error())
          assert native_available(), native_import_error()
          PY

      - name: Run topology-aware extraction tests
        run: uv run --no-sync pytest -q tests/core/test_topology_aware_skeleton.py

      - name: Validate notebook portability
        run: |
          uv run --no-sync python dev/validate_notebook_portability.py
          uv run --no-sync python dev/normalize_notebook_environments.py --check

      - name: Run 04 synthetic ground-truth validation
        env:
          PYTHONNOUSERSITE: '1'
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: 'true'
          PLOTLY_RENDERER: json
        run: uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/04_synthetic_ground_truth_validation.ipynb --timeout 7200

      - name: Run 01 Yamada sanity checks
        env:
          PYTHONNOUSERSITE: '1'
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: 'true'
          PLOTLY_RENDERER: json
        run: uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/01_sanity_checks.ipynb --timeout 7200

      - name: Run 02 application output regression
        env:
          PYTHONNOUSERSITE: '1'
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: 'true'
          PLOTLY_RENDERER: json
        run: uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/02_application_output_regression.ipynb --timeout 7200
