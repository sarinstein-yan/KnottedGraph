name: Skeletonization optimization validation

on:
  push:
    branches:
      - Skeltonization_optimization
    paths-ignore:
      - dev/skeletonization_validation_results.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skeletonization-optimization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install complete validation environment
        run: uv sync --extra all --group dev --group docs --group benchmark

      - name: Verify native Yamada backend
        id: native
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync python - <<'PY' 2>&1 | tee /tmp/native.log
          from knotted_graph.invariants.yamada.native import native_available, native_import_error
          print('native Yamada backend:', native_available())
          print('native import error:', native_import_error())
          assert native_available(), native_import_error()
          PY

      - name: Run optimized skeleton workflow tests
        id: unit
        if: steps.native.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync pytest -q \
            tests/core/test_topology_aware_skeleton.py \
            tests/applications/test_material_surface_optimization.py \
            tests/applications/test_nodal_regressions.py \
            2>&1 | tee /tmp/unit.log

      - name: Audit optimized integration
        id: integration
        if: steps.unit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            uv run --no-sync ruff check \
              src/knotted_graph/extraction \
              src/knotted_graph/applications/material_surface.py \
              src/knotted_graph/applications/_material_surface_base.py \
              tests/core/test_topology_aware_skeleton.py \
              tests/applications/test_material_surface_optimization.py
            PYTHONPATH="${GITHUB_WORKSPACE}/src" PYTHONNOUSERSITE=1 \
              uv run --no-sync python dev/check_repository_consistency.py
          } 2>&1 | tee /tmp/integration.log

      - name: Validate notebook portability
        id: portability
        if: steps.integration.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            uv run --no-sync python dev/validate_notebook_portability.py
            uv run --no-sync python dev/normalize_notebook_environments.py --check
          } 2>&1 | tee /tmp/portability.log

      - name: Run 04 synthetic ground-truth validation
        id: ground_truth
        if: steps.portability.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONNOUSERSITE: '1'
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: 'true'
          PLOTLY_RENDERER: json
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/04_thick_handlebody_validation.ipynb --timeout 7200 2>&1 | tee /tmp/ground_truth.log

      - name: Run 01 Yamada sanity checks
        id: sanity
        if: steps.ground_truth.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONNOUSERSITE: '1'
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: 'true'
          PLOTLY_RENDERER: json
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/01_yamada_sanity_checks.ipynb --timeout 7200 2>&1 | tee /tmp/sanity.log

      - name: Run 02 application output regression
        id: regression
        if: steps.sanity.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONNOUSERSITE: '1'
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: 'true'
          PLOTLY_RENDERER: json
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/02_application_regression_checks.ipynb --timeout 7200 2>&1 | tee /tmp/regression.log

      - name: Persist validation report
        if: always()
        shell: bash
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "native=${{ steps.native.outcome }}"
            echo "unit=${{ steps.unit.outcome }}"
            echo "integration=${{ steps.integration.outcome }}"
            echo "portability=${{ steps.portability.outcome }}"
            echo "04_ground_truth=${{ steps.ground_truth.outcome }}"
            echo "01_sanity=${{ steps.sanity.outcome }}"
            echo "02_regression=${{ steps.regression.outcome }}"
            for item in native unit integration portability ground_truth sanity regression; do
              echo
              echo "===== ${item} ====="
              if test -f "/tmp/${item}.log"; then cat "/tmp/${item}.log"; else echo "not run"; fi
            done
          } > dev/skeletonization_validation_results.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dev/skeletonization_validation_results.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record skeletonization optimization validation [skip ci]"
            git push origin HEAD:Skeltonization_optimization
          fi

      - name: Enforce validation gates
        if: always()
        shell: bash
        run: |
          test "${{ steps.native.outcome }}" = success
          test "${{ steps.unit.outcome }}" = success
          test "${{ steps.integration.outcome }}" = success
          test "${{ steps.portability.outcome }}" = success
          test "${{ steps.ground_truth.outcome }}" = success
          test "${{ steps.sanity.outcome }}" = success
          test "${{ steps.regression.outcome }}" = success
