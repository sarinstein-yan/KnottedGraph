name: Yamada theta collision certification

on:
  pull_request:
    paths:
      - "dev/discover_yamada_theta_collisions.py"
      - "dev/certify_theta_yamada_collision_candidates.py"
      - "dev/certify_theta_complement_group.py"
      - "dev/certify_theta_branched_lifts.py"
      - "dev/certify_theta_branched_lifts_v2.py"
      - "dev/search_prime_certified_yamada_pairs.py"
      - "dev/search_all_size2_prime_collisions.py"
      - "dev/export_theta_collision_certificates.py"
      - "dev/analyze_theta_collision_structure.py"
      - ".github/workflows/yamada-theta-collision-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-minimal-collisions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install KnottedGraph and independent Topoly oracle
        run: uv sync --group dev --group benchmark
      - name: Require production native Yamada backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available
          assert native_available()
          PY
      - name: Build plantri 5.8
        run: |
          curl -fsSLo /tmp/plantri58.tar.gz https://users.cecs.anu.edu.au/~bdm/plantri/plantri58.tar.gz
          mkdir -p /tmp/plantri-src
          tar -xzf /tmp/plantri58.tar.gz -C /tmp/plantri-src --strip-components=1
          cc -O3 -o /tmp/plantri /tmp/plantri-src/plantri.c
      - name: Independently certify Yamada collision pairs by constituent knots
        run: |
          uv run --no-sync python dev/certify_theta_yamada_collision_candidates.py \
            --plantri /tmp/plantri \
            --output research_results/theta8_collision_certification.json
      - name: Certify same-constituent candidates by complement-group fingerprints
        run: |
          uv run --no-sync python dev/certify_theta_complement_group.py \
            --plantri /tmp/plantri \
            --output research_results/theta8_complement_group_certification.json
      - name: Analyze boundary structure of same-constituent candidates
        run: |
          uv run --no-sync python dev/analyze_theta_collision_structure.py \
            --plantri /tmp/plantri \
            --output research_results/theta8_structure_analysis.json
      - name: Run original branched-cover diagnostic
        run: |
          uv run --no-sync python dev/certify_theta_branched_lifts.py \
            --plantri /tmp/plantri \
            --output research_results/theta8_branched_lift_certification.json \
            --xyz-dir research_results/theta8_branched_lifts
      - name: Run corrected ambient branched-cover certification
        run: |
          uv run --no-sync python dev/certify_theta_branched_lifts_v2.py \
            --plantri /tmp/plantri \
            --output research_results/theta8_branched_lift_v2_certification.json \
            --xyz-dir research_results/theta8_branched_lifts
      - name: Search prime certificates across selected collision pairs
        run: |
          uv run --no-sync python dev/search_prime_certified_yamada_pairs.py \
            --plantri /tmp/plantri \
            --output research_results/theta8_prime_pair_search_certification.json \
            --xyz-dir research_results/theta8_branched_lifts \
            --rotations 3000
      - name: Scan all size-two collision buckets for prime pairs
        run: |
          uv run --no-sync python dev/search_all_size2_prime_collisions.py \
            --plantri /tmp/plantri \
            --output research_results/theta8_all_size2_prime_search_certification.json \
            --xyz-dir research_results/theta8_branched_lifts \
            --rotations 2000
      - name: Export exact diagram and reconstruction certificates
        run: |
          uv run --no-sync python dev/export_theta_collision_certificates.py \
            --plantri /tmp/plantri \
            --output-dir research_results/theta8_exact_certificates
      - name: Upload independent certificates
        uses: actions/upload-artifact@v4
        with:
          name: theta8-yamada-collision-certification
          path: |
            research_results/theta8_*certification.json
            research_results/theta8_structure_analysis.json
            research_results/theta8_branched_lifts/**
            research_results/theta8_exact_certificates/**
          if-no-files-found: error
