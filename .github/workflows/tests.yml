name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - Latest_Workplace

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core development environment
        run: uv sync --group dev

      - name: Require compiled Yamada backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available
          print("native Yamada backend:", native_available())
          assert native_available(), "CI compiler is available but native extension was not built"
          PY

      - name: Run base-dependency tests
        run: >
          uv run --no-sync pytest -q
          tests/core
          tests/contracts
          tests/invariants

  optional:
    name: Full optional Python stack (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all Python extras
        run: uv sync --group dev --all-extras

      - name: Require compiled Yamada backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available
          assert native_available()
          PY

      - name: Run complete Python test suite
        run: uv run --no-sync pytest -q

  wheel:
    name: Build and install wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: uv build
      - name: Create clean wheel environment
        run: python -m venv wheel-test
      - name: Install built wheel
        run: wheel-test/bin/pip install dist/*.whl
      - name: Smoke-test installed wheel and native backend
        run: |
          wheel-test/bin/python - <<'PY'
          import sympy as sp
          import knotted_graph
          from knotted_graph.core import ThetaGraph
          from knotted_graph.invariants.yamada import compute_yamada_polynomial_recursive
          from knotted_graph.invariants.yamada.native import native_available
          A = sp.Symbol("A")
          result = compute_yamada_polynomial_recursive(ThetaGraph(3), A)
          print("version:", knotted_graph.__version__)
          print("native Yamada backend:", native_available())
          print("Theta_3:", result)
          assert native_available(), "built wheel does not contain native Yamada extension"
          assert result != 0
          PY

  lint:
    name: Ruff (new review code)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development environment
        run: uv sync --group dev

      - name: Run Ruff
        run: uv run --no-sync ruff check src tests
