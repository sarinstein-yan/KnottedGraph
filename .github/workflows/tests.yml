name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - Latest_Workplace

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core development environment
        run: uv sync --group dev

      - name: Require compiled Yamada backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available
          print("native Yamada backend:", native_available())
          assert native_available(), "CI compiler is available but native extension was not built"
          PY

      - name: Run base-dependency tests
        run: >
          uv run --no-sync pytest -q
          tests/core
          tests/contracts
          tests/invariants

  optional:
    name: Full optional Python stack (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all Python extras
        run: uv sync --group dev --all-extras

      - name: Require compiled Yamada backend
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.invariants.yamada.native import native_available
          assert native_available()
          PY

      - name: Audit repository consistency
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PYTHONNOUSERSITE: '1'
        run: uv run --no-sync python dev/check_repository_consistency.py

      - name: Run complete Python test suite with coverage
        run: >
          uv run --no-sync pytest -q
          --cov=knotted_graph
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=61

  wheel:
    name: Native wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            venv-python: wheel-test/bin/python
          - os: macos-latest
            venv-python: wheel-test/bin/python
          - os: windows-latest
            venv-python: wheel-test/Scripts/python.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: uv build
      - name: Create clean wheel environment
        shell: bash
        run: python -m venv wheel-test
      - name: Install built wheel
        shell: bash
        run: |
          WHEEL=$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.whl')))")
          "${{ matrix.venv-python }}" -m pip install "$WHEEL"
      - name: Smoke-test installed wheel and native backend
        shell: bash
        run: |
          "${{ matrix.venv-python }}" - <<'PY'
          import sympy as sp
          import knotted_graph
          from knotted_graph.core import ThetaGraph
          from knotted_graph.invariants.yamada import compute_graph_yamada_polynomial
          from knotted_graph.invariants.yamada.native import native_available

          A = sp.Symbol("A")
          result = compute_graph_yamada_polynomial(ThetaGraph(3), A)
          print("version:", knotted_graph.__version__)
          print("native Yamada backend:", native_available())
          print("Theta_3:", result)
          assert native_available(), "built wheel does not contain native Yamada extension"
          assert result != 0
          PY
  lint:
    name: Ruff (new review code)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development environment
        run: uv sync --group dev

      - name: Run Ruff
        run: uv run --no-sync ruff check src tests dev/check_repository_consistency.py

      - name: Run incremental Pyright checks
        run: uv run --no-sync pyright
