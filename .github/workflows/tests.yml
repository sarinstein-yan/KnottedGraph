name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - Latest_Workplace

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core development environment
        run: uv sync --group dev

      - name: Run base-dependency tests
        run: >
          uv run --no-sync pytest -q
          tests/core
          tests/contracts
          tests/invariants

  optional:
    name: Full optional Python stack (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all Python extras
        run: uv sync --group dev --all-extras

      - name: Run complete Python test suite
        run: uv run --no-sync pytest -q

  lint:
    name: Ruff (new review code)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development environment
        run: uv sync --group dev

      - name: Run Ruff on newly added review code
        run: >
          uv run --no-sync ruff check
          scripts/bootstrap_repulsion.py
          tests/applications/test_nodal_regressions.py
          tests/projection/test_crossing_search_regression.py
          tests/projection/test_trivial_self_crossing_convention.py
          tests/invariants/yamada/test_state_streaming_regression.py
