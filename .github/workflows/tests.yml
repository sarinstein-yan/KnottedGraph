name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - Latest_Workplace

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core development environment
        run: uv sync --group dev

      - name: Run base-dependency tests
        run: >
          uv run --no-sync pytest -q
          tests/core
          tests/contracts
          tests/invariants
          tests/projection/test_public_api_validation.py
          tests/inputs/test_optional_dependencies.py
          tests/inputs/test_coordinate_chain.py
          tests/inputs/test_biomolecular.py

  optional:
    name: Full optional Python stack (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all Python extras
        run: uv sync --group dev --all-extras

      - name: Run complete Python test suite
        run: uv run --no-sync pytest -q

  wheel:
    name: Build and install wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: uv build
      - name: Create clean wheel environment
        run: python -m venv wheel-test
      - name: Install built wheel
        run: wheel-test/bin/pip install dist/*.whl
      - name: Smoke-test installed wheel
        run: |
          wheel-test/bin/pip check
          wheel-test/bin/python examples/quickstart.py
          wheel-test/bin/python - <<'PY'
          import knotted_graph
          print("version:", knotted_graph.__version__)
          import knotted_graph.inputs as inputs
          try:
              inputs.from_surface_mesh
          except ImportError as exc:
              assert "knotted_graph[surface]" in str(exc)
          else:
              raise AssertionError("base wheel unexpectedly imported the surface extra")
          PY
        env:
          PYTHONPATH: ""

  lint:
    name: Ruff (new review code)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development environment
        run: uv sync --group dev

      - name: Run Ruff
        run: uv run --no-sync ruff check src tests examples/quickstart.py
